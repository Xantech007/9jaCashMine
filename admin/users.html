<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Manage Users - Flutterwave MineApp Admin</title>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="../firebase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#0f172a;color:#f8fafc;min-height:100vh;transition:all 0.3s ease;}

body.light-mode{background:#f8fafc;color:#1e293b;}
body.light-mode .soft-bg{background:radial-gradient(ellipse at 0% 0%,rgba(99,102,241,0.08),transparent 50%),radial-gradient(ellipse at 100% 100%,rgba(236,72,153,0.06),transparent 50%),radial-gradient(ellipse at 50% 50%,rgba(16,185,129,0.04),transparent 50%),#f8fafc;}
body.light-mode .card{background:#fff;border-color:#e2e8f0;box-shadow:0 4px 24px rgba(0,0,0,0.06);}
body.light-mode .back-btn{background:#fff;border-color:#e2e8f0;color:#64748b;}
body.light-mode .back-btn:hover{background:#f1f5f9;color:#6366f1;}
body.light-mode .header-title{color:#1e293b;}
body.light-mode .table-container{background:#fff;border-color:#e2e8f0;}
body.light-mode th{background:#f8fafc;color:#64748b;border-bottom-color:#e2e8f0;}
body.light-mode td{border-bottom-color:#e2e8f0;color:#1e293b;}
body.light-mode .footer-text{color:#94a3b8;}
body.light-mode .theme-toggle{color:#64748b;}
body.light-mode .input-field{background:#f8fafc;border-color:#e2e8f0;color:#1e293b;}
body.light-mode .input-field:focus{border-color:#6366f1;background:#fff;}

.soft-bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 0% 0%,rgba(99,102,241,0.12),transparent 50%),radial-gradient(ellipse at 100% 100%,rgba(236,72,153,0.08),transparent 50%),radial-gradient(ellipse at 50% 50%,rgba(16,185,129,0.06),transparent 50%),#0f172a;transition:all 0.3s ease;}

.app{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:0 20px 40px;}

.topbar{padding:24px 0 16px;display:flex;align-items:center;justify-content:space-between;}
.back-btn{width:44px;height:44px;border-radius:14px;background:#1e293b;border:1px solid #334155;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:16px;cursor:pointer;transition:all 0.3s;}
.back-btn:hover{background:#334155;color:#818cf8;}
.header-title{font-size:20px;font-weight:800;color:#f8fafc;}
.theme-toggle{width:44px;height:44px;border-radius:14px;background:#1e293b;border:1px solid #334155;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:16px;cursor:pointer;transition:all 0.3s;}
.theme-toggle:hover{background:#334155;color:#818cf8;}

.card{background:#1e293b;border-radius:24px;padding:24px;border:1px solid #334155;box-shadow:0 4px 24px rgba(0,0,0,0.2);margin-bottom:16px;}

.search-box{margin-bottom:20px;}
.input-field{width:100%;padding:14px 16px;border-radius:14px;background:#0f172a;border:1px solid #334155;color:#f8fafc;font-size:14px;font-weight:600;outline:none;transition:all 0.3s;}
.input-field:focus{border-color:#6366f1;}

.table-container{width:100%;overflow-x:auto;}
table{width:100%;border-collapse:collapse;text-align:left;font-size:13px;}
th{padding:14px 16px;background:#0f172a;color:#94a3b8;font-weight:700;border-bottom:1px solid #334155;text-transform:uppercase;font-size:11px;letter-spacing:1px;}
td{padding:16px;border-bottom:1px solid #334155;color:#f8fafc;vertical-align:middle;}
tr:last-child td{border-bottom:none;}

.badge{display:inline-block;padding:4px 10px;border-radius:50px;font-size:10px;font-weight:700;text-transform:uppercase;background:rgba(99,102,241,0.1);color:#818cf8;border:1px solid rgba(99,102,241,0.2);}

.action-btns{display:flex;gap:6px;}
.action-btn{padding:6px 12px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;border:none;transition:all 0.2s;}
.edit-btn{background:#6366f1;color:#fff;}
.edit-btn:hover{background:#4f46e5;}
.delete-btn{background:#ef4444;color:#fff;}
.delete-btn:hover{background:#dc2626;}

.footer{text-align:center;margin-top:32px;}
.footer-text{font-size:12px;color:#64748b;font-weight:500;}

@keyframes slideUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.anim{animation:slideUp 0.6s ease both;}
</style>
</head>
<body>

<div class="soft-bg"></div>

<div class="app">

<div class="topbar anim">
  <button class="back-btn" onclick="window.location.href='dashboard.html'">
    <i class="fa-solid fa-arrow-left"></i>
  </button>
  <div class="header-title">Manage Users</div>
  <button class="theme-toggle" onclick="toggleTheme()">
    <i class="fa-solid fa-sun" id="themeIcon"></i>
  </button>
</div>

<div class="card anim">
  <div class="search-box">
    <input type="text" id="searchInput" class="input-field" placeholder="Search by name, phone or country..." oninput="filterUsers()">
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>User</th>
          <th>Plan</th>
          <th>Balances (€)</th>
          <th>Country</th>
          <th>Total Mined</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="usersTableBody">
        <tr>
          <td colspan="6" style="text-align:center; color:#94a3b8; padding:30px;">Loading users...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<div class="footer anim">
  <div class="footer-text">Flutterwave MineApp Admin • 2026</div>
</div>

</div>

<script>
let allUsers = [];

function initTheme() {
  const isLight = localStorage.getItem("9jaCashDark") !== "true";
  if (isLight) {
    document.body.classList.add("light-mode");
    document.getElementById("themeIcon").className = "fa-solid fa-moon";
  }
}

function toggleTheme() {
  const isLight = document.body.classList.toggle("light-mode");
  localStorage.setItem("9jaCashDark", !isLight);
  document.getElementById("themeIcon").className = isLight ? "fa-solid fa-moon" : "fa-solid fa-sun";
}

async function loadUsers() {
  if (window._9jaCash && window._9jaCash.db) {
    const db = window._9jaCash.db;
    try {
      const snapshot = await db.collection("users").get();
      allUsers = [];
      snapshot.forEach(doc => {
        allUsers.push({ id: doc.id, ...doc.data() });
      });
      renderTable(allUsers);
    } catch (err) {
      console.error("Error loading users:", err);
      document.getElementById("usersTableBody").innerHTML = `<tr><td colspan="6" style="text-align:center; color:#ef4444; padding:30px;">Failed to load users collection.</td></tr>`;
    }
  }
}

function renderTable(users) {
  const tbody = document.getElementById("usersTableBody");

  if (users.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#94a3b8; padding:30px;">No users found.</td></tr>`;
    return;
  }

  let html = "";
  users.forEach(u => {
    const mainBal = parseFloat(u.balance || 0).toFixed(2);
    const refBal = parseFloat(u.balanceReferral || 0).toFixed(2);
    const regBal = parseFloat(u.balanceRegister || 0).toFixed(2);
    const mined = parseFloat(u.totalMined || 0).toFixed(2);

    html += `
      <tr>
        <td>
          <div style="font-weight:700;">${u.fullName || u.name || 'Unknown'}</div>
          <div style="font-size:11px; color:#94a3b8;">Phone: ${u.phone || u.id}</div>
        </td>
        <td>
          <span class="badge">${u.plan || 'Free Plan'}</span>
        </td>
        <td>
          <div style="font-weight:700; color:#10b981;">Main: €${mainBal}</div>
          <div style="font-size:11px; color:#94a3b8;">Ref: €${refBal} | Reg: €${regBal}</div>
        </td>
        <td>
          <div style="font-weight:600;">${u.country || 'N/A'}</div>
        </td>
        <td>
          <div style="font-weight:700; color:#f59e0b;">€${mined}</div>
        </td>
        <td>
          <div class="action-btns">
            <button class="action-btn edit-btn" onclick="editUser('${u.id}')"><i class="fa-solid fa-pen"></i></button>
            <button class="action-btn delete-btn" onclick="deleteUser('${u.id}')"><i class="fa-solid fa-trash"></i></button>
          </div>
        </td>
      </tr>
    `;
  });
  tbody.innerHTML = html;
}

function filterUsers() {
  const query = document.getElementById("searchInput").value.toLowerCase();
  const filtered = allUsers.filter(u => {
    const name = (u.fullName || u.name || "").toLowerCase();
    const phone = (u.phone || u.id || "").toLowerCase();
    const country = (u.country || "").toLowerCase();
    return name.includes(query) || phone.includes(query) || country.includes(query);
  });
  renderTable(filtered);
}

async function editUser(phoneId) {
  const user = allUsers.find(u => u.id === phoneId || u.phone === phoneId);
  if (!user) return;

  const { value: formValues } = await Swal.fire({
    title: 'Edit User Details',
    background: document.body.classList.contains("light-mode") ? "#fff" : "#1e293b",
    color: document.body.classList.contains("light-mode") ? "#1e293b" : "#f8fafc",
    html: `
      <div style="text-align:left; display:flex; flex-direction:column; gap:10px; max-height: 60vh; overflow-y: auto; padding-right: 5px;">
        <label style="font-size:12px; font-weight:700;">Full Name</label>
        <input id="swal-input-name" class="swal2-input" style="margin:0; width:100%;" value="${user.fullName || user.name || ''}">
        
        <label style="font-size:12px; font-weight:700;">Plan</label>
        <input id="swal-input-plan" class="swal2-input" style="margin:0; width:100%;" value="${user.plan || ''}">
        
        <label style="font-size:12px; font-weight:700;">New Password (leave blank to keep current)</label>
        <input id="swal-input-password" type="text" class="swal2-input" style="margin:0; width:100%;" placeholder="Enter new password">

        <label style="font-size:12px; font-weight:700;">Main Balance (€)</label>
        <input id="swal-input-balance" type="number" step="any" class="swal2-input" style="margin:0; width:100%;" value="${user.balance || 0}">
        
        <label style="font-size:12px; font-weight:700;">Referral Balance (€)</label>
        <input id="swal-input-ref" type="number" step="any" class="swal2-input" style="margin:0; width:100%;" value="${user.balanceReferral || 0}">
        
        <label style="font-size:12px; font-weight:700;">Country</label>
        <input id="swal-input-country" class="swal2-input" style="margin:0; width:100%;" value="${user.country || ''}">
      </div>
    `,
    focusConfirm: false,
    showCancelButton: true,
    confirmButtonColor: '#6366f1',
    preConfirm: () => {
      const newPassword = document.getElementById('swal-input-password').value.trim();
      const payload = {
        fullName: document.getElementById('swal-input-name').value,
        name: document.getElementById('swal-input-name').value,
        plan: document.getElementById('swal-input-plan').value,
        balance: parseFloat(document.getElementById('swal-input-balance').value) || 0,
        balanceReferral: parseFloat(document.getElementById('swal-input-ref').value) || 0,
        country: document.getElementById('swal-input-country').value
      };
      if (newPassword) {
        payload.password = newPassword;
      }
      return payload;
    }
  });

  if (formValues) {
    if (window._9jaCash && window._9jaCash.db) {
      const db = window._9jaCash.db;
      try {
        await db.collection("users").doc(phoneId).update(formValues);
        Swal.fire('Updated!', 'User details have been updated successfully.', 'success');
        loadUsers();
      } catch (err) {
        console.error("Error updating user:", err);
        Swal.fire('Error', 'Failed to update user record.', 'error');
      }
    }
  }
}

async function deleteUser(phoneId) {
  const result = await Swal.fire({
    title: 'Are you sure?',
    text: `Do you want to delete user account ${phoneId}? This cannot be undone.`,
    icon: 'warning',
    showCancelButton: true,
    confirmButtonColor: '#ef4444',
    confirmButtonText: 'Yes, delete it!'
  });

  if (result.isConfirmed) {
    if (window._9jaCash && window._9jaCash.db) {
      const db = window._9jaCash.db;
      try {
        await db.collection("users").doc(phoneId).delete();
        Swal.fire('Deleted!', 'User has been removed.', 'success');
        loadUsers();
      } catch (err) {
        console.error("Error deleting user:", err);
        Swal.fire('Error', 'Failed to delete user.', 'error');
      }
    }
  }
}

window.addEventListener("DOMContentLoaded", function() {
  initTheme();
  loadUsers();
});
</script>

</body>
</html>
