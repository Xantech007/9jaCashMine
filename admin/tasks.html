<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Manage Tasks - FlutterW Euro Earn Admin</title>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="../firebase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#0f172a;color:#f8fafc;min-height:100vh;transition:all 0.3s ease;}

body.light-mode{background:#f8fafc;color:#1e293b;}
body.light-mode .soft-bg{background:radial-gradient(ellipse at 0% 0%,rgba(99,102,241,0.08),transparent 50%),radial-gradient(ellipse at 100% 100%,rgba(236,72,153,0.06),transparent 50%),radial-gradient(ellipse at 50% 50%,rgba(16,185,129,0.04),transparent 50%),#f8fafc;}
body.light-mode .card{background:#fff;border-color:#e2e8f0;box-shadow:0 4px 24px rgba(0,0,0,0.06);}
body.light-mode .back-btn{background:#fff;border-color:#e2e8f0;color:#64748b;}
body.light-mode .back-btn:hover{background:#f1f5f9;color:#6366f1;}
body.light-mode .header-title{color:#1e293b;}
body.light-mode .section-title{color:#1e293b;}
body.light-mode .input-label{color:#64748b;}
body.light-mode .checkbox-label{color:#1e293b;}
body.light-mode .footer-text{color:#94a3b8;}
body.light-mode .theme-toggle{color:#64748b;}
body.light-mode .flow-badge{background:#f1f5f9;color:#64748b;border-color:#e2e8f0;}
body.light-mode .input-field, body.light-mode select.input-field{background:#f8fafc;border-color:#e2e8f0;color:#1e293b;}
body.light-mode .input-field:focus{border-color:#6366f1;background:#fff;}
body.light-mode select.input-field option{background:#fff;color:#1e293b;}
body.light-mode .task-card{background:#f8fafc;border-color:#e2e8f0;}
body.light-mode .task-info h4{color:#1e293b;}
body.light-mode .task-meta{color:#64748b;}

.soft-bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 0% 0%,rgba(99,102,241,0.12),transparent 50%),radial-gradient(ellipse at 100% 100%,rgba(236,72,153,0.08),transparent 50%),radial-gradient(ellipse at 50% 50%,rgba(16,185,129,0.06),transparent 50%),#0f172a;transition:all 0.3s ease;}

.app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:0 20px 40px;}

.topbar{padding:24px 0 16px;display:flex;align-items:center;justify-content:space-between;}
.back-btn{width:44px;height:44px;border-radius:14px;background:#1e293b;border:1px solid #334155;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:16px;cursor:pointer;transition:all 0.3s;}
.back-btn:hover{background:#334155;color:#818cf8;}
.back-btn:active{transform:scale(0.92);}
.header-title{font-size:18px;font-weight:800;color:#f8fafc;transition:color 0.3s;}
.theme-toggle{width:44px;height:44px;border-radius:14px;background:#1e293b;border:1px solid #334155;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:16px;cursor:pointer;transition:all 0.3s;}
.theme-toggle:hover{background:#334155;color:#818cf8;}

.flow-badge{display:inline-flex;align-items:center;gap:6px;background:#1e293b;border:1px solid #334155;border-radius:50px;padding:6px 14px;font-size:11px;font-weight:700;color:#ec4899;margin-bottom:16px;}
.flow-badge i{font-size:12px;}

.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.section-title{font-size:18px;font-weight:800;letter-spacing:-0.3px;color:#f8fafc;}

.card{background:#1e293b;border-radius:24px;padding:20px;border:1px solid #334155;box-shadow:0 4px 24px rgba(0,0,0,0.2);margin-bottom:20px;transition:all 0.3s ease;}

.input-group{margin-bottom:14px;}
.input-label{display:block;font-size:12px;font-weight:700;color:#94a3b8;margin-bottom:6px;}
.input-field{width:100%;padding:12px 16px;border-radius:14px;background:#0f172a;border:1px solid #334155;color:#f8fafc;font-size:14px;font-weight:600;outline:none;transition:all 0.3s;}
.input-field:focus{border-color:#6366f1;}
select.input-field option{background:#0f172a;color:#f8fafc;}

.checkbox-group{display:flex;align-items:center;gap:10px;margin-top:8px;margin-bottom:16px;cursor:pointer;}
.checkbox-group input{width:18px;height:18px;accent-color:#6366f1;cursor:pointer;}
.checkbox-label{font-size:13px;font-weight:700;color:#f8fafc;cursor:pointer;}

.submit-btn{width:100%;padding:16px;border-radius:16px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-size:15px;font-weight:800;border:none;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 4px 20px rgba(99,102,241,0.3);}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(99,102,241,0.4);}
.submit-btn:active{transform:scale(0.97);}

.task-list{display:flex;flex-direction:column;gap:12px;}
.task-card{background:#0f172a;border:1px solid #334155;border-radius:16px;padding:16px;display:flex;align-items:center;justify-content:space-between;transition:all 0.3s;}
.task-info h4{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;color:#f8fafc;}
.task-meta{font-size:12px;color:#94a3b8;margin-top:4px;font-weight:500;}
.badge-hot{background:rgba(236,72,153,0.1);color:#ec4899;font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;border:1px solid rgba(236,72,153,0.2);}
.delete-btn{width:36px;height:36px;border-radius:10px;background:rgba(239,68,68,0.1);color:#ef4444;border:1px solid rgba(239,68,68,0.2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.3s;}
.delete-btn:hover{background:#ef4444;color:#fff;}

.footer{text-align:center;margin-top:32px;}
.footer-text{font-size:12px;color:#64748b;font-weight:500;}

@keyframes slideUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.anim{animation:slideUp 0.6s ease both;}
</style>
</head>
<body>

<div class="soft-bg"></div>

<div class="app">

<div class="topbar anim">
  <button class="back-btn" onclick="window.location.href='dashboard.html'">
    <i class="fa-solid fa-arrow-left"></i>
  </button>
  <div class="header-title">Task Management</div>
  <button class="theme-toggle" onclick="toggleTheme()">
    <i class="fa-solid fa-sun" id="themeIcon"></i>
  </button>
</div>

<div class="anim" style="text-align:center;">
  <div class="flow-badge">
    <i class="fa-solid fa-list-check"></i> <span>Settings / tasks Document</span>
  </div>
</div>

<!-- Add Task Form Card -->
<div class="card anim">
  <div class="section-header" style="margin-bottom:14px;">
    <div class="section-title" style="font-size:16px;"><i class="fa-solid fa-plus-circle text-indigo-500 mr-2"></i> Add New Task</div>
  </div>

  <div class="input-group">
    <label class="input-label">Task Name</label>
    <input type="text" id="taskName" class="input-field" placeholder="e.g. Follow us on TikTok">
  </div>

  <div class="input-group">
    <label class="input-label">Category</label>
    <select id="taskCategory" class="input-field">
      <option value="tiktok">TikTok</option>
      <option value="telegram">Telegram</option>
      <option value="youtube">YouTube</option>
      <option value="instagram">Instagram</option>
      <option value="twitter">Twitter / X</option>
      <option value="website">Website</option>
    </select>
  </div>

  <div class="input-group">
    <label class="input-label">Reward Amount (Amt)</label>
    <input type="number" id="taskAmt" class="input-field" placeholder="e.g. 500">
  </div>

  <div class="input-group">
    <label class="input-label">Task Link / URL</label>
    <input type="url" id="taskLink" class="input-field" placeholder="https://tiktok.com">
  </div>

  <div class="checkbox-group" onclick="document.getElementById('taskHot').click()">
    <input type="checkbox" id="taskHot" onclick="event.stopPropagation()">
    <label class="checkbox-label" for="taskHot">Mark as Hot Task 🔥</label>
  </div>

  <button class="submit-btn" id="saveTaskBtn" onclick="handleAddTask()">
    <i class="fa-solid fa-cloud-arrow-up"></i> Save Task to Firestore
  </button>
</div>

<!-- Existing Tasks List -->
<div class="anim">
  <div class="section-header">
    <div class="section-title">Active Tasks List</div>
  </div>
  
  <div class="task-list" id="taskListContainer">
    <div style="text-align:center;padding:20px;color:#94a3b8;font-size:13px;">
      <i class="fa-solid fa-spinner fa-spin"></i> Loading tasks from settings/tasks...
    </div>
  </div>
</div>

<div class="footer anim">
  <div class="footer-text">FlutterW Euro Earn Admin • 2026</div>
</div>

</div>

<script>
const adminSession = localStorage.getItem("9jaCashAdmin");
if (!adminSession) {
  window.location.href = "login.html";
}

function initTheme() {
  const isLight = localStorage.getItem("9jaCashDark") !== "true";
  if (isLight) {
    document.body.classList.add("light-mode");
    document.getElementById("themeIcon").className = "fa-solid fa-moon";
  }
}

function toggleTheme() {
  const isLight = document.body.classList.toggle("light-mode");
  localStorage.setItem("9jaCashDark", !isLight);
  document.getElementById("themeIcon").className = isLight ? "fa-solid fa-moon" : "fa-solid fa-sun";
}

let currentTasksArray = [];

async function loadTasks() {
  const container = document.getElementById("taskListContainer");
  try {
    if (window._9jaCash && window._9jaCash.db) {
      const db = window._9jaCash.db;
      const docRef = db.collection("settings").doc("tasks");
      const docSnap = await docRef.get();

      if (docSnap.exists) {
        const data = docSnap.data();
        currentTasksArray = data.tasks || [];
        renderTasks();
      } else {
        container.innerHTML = `<div style="text-align:center;padding:20px;color:#94a3b8;font-size:13px;">No 'tasks' document found in 'settings' collection. Add your first task above to initialize it.</div>`;
      }
    }
  } catch (err) {
    console.error("Error loading tasks:", err);
    container.innerHTML = `<div style="text-align:center;padding:20px;color:#ef4444;font-size:13px;">Failed to load tasks.</div>`;
  }
}

function renderTasks() {
  const container = document.getElementById("taskListContainer");
  if (currentTasksArray.length === 0) {
    container.innerHTML = `<div style="text-align:center;padding:20px;color:#94a3b8;font-size:13px;">No tasks available right now.</div>`;
    return;
  }

  container.innerHTML = "";
  currentTasksArray.forEach((task, index) => {
    const card = document.createElement("div");
    card.className = "task-card";
    card.innerHTML = `
      <div class="task-info">
        <h4>${task.name} ${task.hot ? '<span class="badge-hot">HOT</span>' : ''}</h4>
        <div class="task-meta">ID: ${task.id} | Category: ${task.category} | Amt: ${task.amt}</div>
      </div>
      <button class="delete-btn" onclick="deleteTask(${index})" title="Delete Task">
        <i class="fa-solid fa-trash-can"></i>
      </button>
    `;
    container.appendChild(card);
  });
}

async function handleAddTask() {
  const name = document.getElementById("taskName").value.trim();
  const category = document.getElementById("taskCategory").value;
  const amtVal = document.getElementById("taskAmt").value.trim();
  const link = document.getElementById("taskLink").value.trim();
  const hot = document.getElementById("taskHot").checked;

  if (!name || !amtVal || !link) {
    Swal.fire({
      icon: "error",
      title: "Missing Fields",
      text: "Please fill out task name, amount, and link URL.",
      background: document.body.classList.contains("light-mode") ? "#fff" : "#1e293b",
      color: document.body.classList.contains("light-mode") ? "#1e293b" : "#f8fafc"
    });
    return;
  }

  const amt = Number(amtVal);
  const newId = "task_" + (currentTasksArray.length + 1) + "_" + Math.floor(Math.random() * 1000);

  const newTaskObj = {
    id: newId,
    name: name,
    category: category,
    hot: hot,
    amt: amt,
    link: link
  };

  const btn = document.getElementById("saveTaskBtn");
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';

  try {
    const db = window._9jaCash.db;
    const docRef = db.collection("settings").doc("tasks");
    
    currentTasksArray.push(newTaskObj);

    await docRef.set({
      tasks: currentTasksArray
    }, { merge: true });

    Swal.fire({
      icon: "success",
      title: "Task Added!",
      text: "New task successfully written to settings/tasks array.",
      timer: 1500,
      showConfirmButton: false,
      background: document.body.classList.contains("light-mode") ? "#fff" : "#1e293b",
      color: document.body.classList.contains("light-mode") ? "#1e293b" : "#f8fafc"
    });

    document.getElementById("taskName").value = "";
    document.getElementById("taskAmt").value = "";
    document.getElementById("taskLink").value = "";
    document.getElementById("taskHot").checked = false;

    renderTasks();
  } catch (err) {
    console.error("Error saving task:", err);
    Swal.fire({
      icon: "error",
      title: "Save Failed",
      text: err.message,
      background: document.body.classList.contains("light-mode") ? "#fff" : "#1e293b",
      color: document.body.classList.contains("light-mode") ? "#1e293b" : "#f8fafc"
    });
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Save Task to Firestore';
  }
}

async function deleteTask(index) {
  Swal.fire({
    title: "Delete Task?",
    text: "This will remove the task item from the Firestore array.",
    icon: "warning",
    showCancelButton: true,
    confirmButtonColor: "#ef4444",
    cancelButtonColor: "#64748b",
    confirmButtonText: "Yes, Delete",
    background: document.body.classList.contains("light-mode") ? "#fff" : "#1e293b",
    color: document.body.classList.contains("light-mode") ? "#1e293b" : "#f8fafc"
  }).then(async (result) => {
    if (result.isConfirmed) {
      try {
        currentTasksArray.splice(index, 1);
        const db = window._9jaCash.db;
        await db.collection("settings").doc("tasks").set({
          tasks: currentTasksArray
        }, { merge: true });

        renderTasks();
        Swal.fire({
          icon: "success",
          title: "Deleted!",
          text: "Task removed successfully.",
          timer: 1200,
          showConfirmButton: false,
          background: document.body.classList.contains("light-mode") ? "#fff" : "#1e293b",
          color: document.body.classList.contains("light-mode") ? "#1e293b" : "#f8fafc"
        });
      } catch (err) {
        console.error("Delete error:", err);
        Swal.fire({
          icon: "error",
          title: "Error",
          text: "Could not delete task.",
          background: document.body.classList.contains("light-mode") ? "#fff" : "#1e293b",
          color: document.body.classList.contains("light-mode") ? "#1e293b" : "#f8fafc"
        });
      }
    }
  });
}

window.addEventListener("DOMContentLoaded", () => {
  initTheme();
  loadTasks();
});
</script>

</body>
</html>
