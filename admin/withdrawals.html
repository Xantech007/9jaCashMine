<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Manage Withdrawals - Flutterwave MineApp Admin</title>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="../firebase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#0f172a;color:#f8fafc;min-height:100vh;transition:all 0.3s ease;}

body.light-mode{background:#f8fafc;color:#1e293b;}
body.light-mode .soft-bg{background:radial-gradient(ellipse at 0% 0%,rgba(99,102,241,0.08),transparent 50%),radial-gradient(ellipse at 100% 100%,rgba(236,72,153,0.06),transparent 50%),radial-gradient(ellipse at 50% 50%,rgba(16,185,129,0.04),transparent 50%),#f8fafc;}
body.light-mode .card{background:#fff;border-color:#e2e8f0;box-shadow:0 4px 24px rgba(0,0,0,0.06);}
body.light-mode .tab-btn{background:#f1f5f9;color:#64748b;border-color:#e2e8f0;}
body.light-mode .tab-btn.active{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border-color:#6366f1;}
body.light-mode .back-btn{background:#fff;border-color:#e2e8f0;color:#64748b;}
body.light-mode .back-btn:hover{background:#f1f5f9;color:#6366f1;}
body.light-mode .header-title{color:#1e293b;}
body.light-mode .table-container{background:#fff;border-color:#e2e8f0;}
body.light-mode th{background:#f8fafc;color:#64748b;border-bottom-color:#e2e8f0;}
body.light-mode td{border-bottom-color:#e2e8f0;color:#1e293b;}
body.light-mode .footer-text{color:#94a3b8;}
body.light-mode .theme-toggle{color:#64748b;}

.soft-bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 0% 0%,rgba(99,102,241,0.12),transparent 50%),radial-gradient(ellipse at 100% 100%,rgba(236,72,153,0.08),transparent 50%),radial-gradient(ellipse at 50% 50%,rgba(16,185,129,0.06),transparent 50%),#0f172a;transition:all 0.3s ease;}

.app{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:0 20px 40px;}

.topbar{padding:24px 0 16px;display:flex;align-items:center;justify-content:space-between;}
.back-btn{width:44px;height:44px;border-radius:14px;background:#1e293b;border:1px solid #334155;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:16px;cursor:pointer;transition:all 0.3s;}
.back-btn:hover{background:#334155;color:#818cf8;}
.header-title{font-size:20px;font-weight:800;color:#f8fafc;}
.theme-toggle{width:44px;height:44px;border-radius:14px;background:#1e293b;border:1px solid #334155;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:16px;cursor:pointer;transition:all 0.3s;}
.theme-toggle:hover{background:#334155;color:#818cf8;}

.tab-bar{display:flex;gap:8px;margin-bottom:20px;overflow-x:auto;padding-bottom:4px;}
.tab-btn{padding:10px 18px;border-radius:12px;background:#1e293b;border:1px solid #334155;color:#94a3b8;font-size:12px;font-weight:700;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;gap:8px;}
.tab-btn.active{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border-color:#6366f1;box-shadow:0 4px 16px rgba(99,102,241,0.3);}

.card{background:#1e293b;border-radius:24px;padding:24px;border:1px solid #334155;box-shadow:0 4px 24px rgba(0,0,0,0.2);margin-bottom:16px;}

.table-container{width:100%;overflow-x:auto;}
table{width:100%;border-collapse:collapse;text-align:left;font-size:13px;}
th{padding:14px 16px;background:#0f172a;color:#94a3b8;font-weight:700;border-bottom:1px solid #334155;text-transform:uppercase;font-size:11px;letter-spacing:1px;}
td{padding:16px;border-bottom:1px solid #334155;color:#f8fafc;vertical-align:middle;}
tr:last-child td{border-bottom:none;}

.badge{display:inline-block;padding:4px 10px;border-radius:50px;font-size:10px;font-weight:700;text-transform:uppercase;}
.badge.pending{background:rgba(245,158,11,0.1);color:#f59e0b;border:1px solid rgba(245,158,11,0.2);}
.badge.approved{background:rgba(16,185,129,0.1);color:#10b981;border:1px solid rgba(16,185,129,0.2);}
.badge.rejected{background:rgba(239,68,68,0.1);color:#ef4444;border:1px solid rgba(239,68,68,0.2);}

.action-btns{display:flex;gap:6px;}
.action-btn{padding:6px 12px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;border:none;transition:all 0.2s;}
.approve-btn{background:#10b981;color:#fff;}
.approve-btn:hover{background:#059669;}
.reject-btn{background:#ef4444;color:#fff;}
.reject-btn:hover{background:#dc2626;}

.footer{text-align:center;margin-top:32px;}
.footer-text{font-size:12px;color:#64748b;font-weight:500;}

@keyframes slideUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.anim{animation:slideUp 0.6s ease both;}
</style>
</head>
<body>

<div class="soft-bg"></div>

<div class="app">

<div class="topbar anim">
  <button class="back-btn" onclick="window.location.href='dashboard.html'">
    <i class="fa-solid fa-arrow-left"></i>
  </button>
  <div class="header-title">Withdrawal Requests</div>
  <button class="theme-toggle" onclick="toggleTheme()">
    <i class="fa-solid fa-sun" id="themeIcon"></i>
  </button>
</div>

<div class="tab-bar anim">
  <button class="tab-btn active" onclick="filterWithdrawals('all', this)">All Requests</button>
  <button class="tab-btn" onclick="filterWithdrawals('pending', this)">Pending</button>
  <button class="tab-btn" onclick="filterWithdrawals('approved', this)">Approved</button>
  <button class="tab-btn" onclick="filterWithdrawals('rejected', this)">Rejected</button>
</div>

<div class="card anim">
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>User</th>
          <th>Type / Plan</th>
          <th>Amount</th>
          <th>Bank Details</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      <tbody id="withdrawalsTableBody">
        <tr>
          <td colspan="6" style="text-align:center; color:#94a3b8; padding:30px;">Loading withdrawal requests...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<div class="footer anim">
  <div class="footer-text">Flutterwave MineApp Admin • 2026</div>
</div>

</div>

<script>
let allWithdrawals = [];
let currentFilter = "all";

function initTheme() {
  const isLight = localStorage.getItem("9jaCashDark") !== "true";
  if (isLight) {
    document.body.classList.add("light-mode");
    document.getElementById("themeIcon").className = "fa-solid fa-moon";
  }
}

function toggleTheme() {
  const isLight = document.body.classList.toggle("light-mode");
  localStorage.setItem("9jaCashDark", !isLight);
  document.getElementById("themeIcon").className = isLight ? "fa-solid fa-moon" : "fa-solid fa-sun";
}

async function loadWithdrawals() {
  if (window._9jaCash && window._9jaCash.db) {
    const db = window._9jaCash.db;
    try {
      const snapshot = await db.collection("withdrawals").orderBy("createdAt", "desc").get();
      allWithdrawals = [];
      snapshot.forEach(doc => {
        allWithdrawals.push({ id: doc.id, ...doc.data() });
      });
      renderTable();
    } catch (err) {
      console.error("Error loading withdrawals:", err);
      document.getElementById("withdrawalsTableBody").innerHTML = `<tr><td colspan="6" style="text-align:center; color:#ef4444; padding:30px;">Failed to load withdrawal requests.</td></tr>`;
    }
  }
}

function filterWithdrawals(status, btnElement) {
  currentFilter = status;
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  btnElement.classList.add("active");
  renderTable();
}

function renderTable() {
  const tbody = document.getElementById("withdrawalsTableBody");
  const filtered = allWithdrawals.filter(w => currentFilter === "all" || w.status === currentFilter);

  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#94a3b8; padding:30px;">No withdrawal requests found.</td></tr>`;
    return;
  }

  let html = "";
  filtered.forEach(w => {
    const amount = parseFloat(w.amount || 0).toFixed(2);
    const dateStr = w.createdAt && w.createdAt.toDate ? w.createdAt.toDate().toLocaleDateString() : "Recent";
    
    html += `
      <tr>
        <td>
          <div style="font-weight:700;">${w.userName || 'Unknown'}</div>
          <div style="font-size:11px; color:#94a3b8;">${w.userId || ''}</div>
        </td>
        <td>
          <div style="text-transform:capitalize; font-weight:600;">${w.type || 'balance'}</div>
          <div style="font-size:11px; color:#94a3b8;">${w.userPlan || 'Free'}</div>
        </td>
        <td>
          <div style="font-weight:800; color:#10b981;">€${amount}</div>
          <div style="font-size:10px; color:#94a3b8;">${dateStr}</div>
        </td>
        <td>
          <div style="font-weight:600;">${w.bank || 'N/A'}</div>
          <div style="font-size:11px; color:#94a3b8;">${w.accNumber || 'N/A'} (${w.accName || 'N/A'})</div>
        </td>
        <td>
          <span class="badge ${w.status || 'pending'}">${w.status || 'pending'}</span>
        </td>
        <td>
          <div class="action-btns">
            ${w.status === 'pending' ? `
              <button class="action-btn approve-btn" onclick="updateStatus('${w.id}', 'approved')"><i class="fa-solid fa-check"></i></button>
              <button class="action-btn reject-btn" onclick="updateStatus('${w.id}', 'rejected')"><i class="fa-solid fa-xmark"></i></button>
            ` : `<span style="font-size:12px; color:#94a3b8;">Processed</span>`}
          </div>
        </td>
      </tr>
    `;
  });
  tbody.innerHTML = html;
}

async function updateStatus(id, newStatus) {
  const actionText = newStatus === 'approved' ? 'approve' : 'reject';
  const result = await Swal.fire({
    title: `Are you sure?`,
    text: `Do you want to ${actionText} this withdrawal request?`,
    icon: 'question',
    showCancelButton: true,
    confirmButtonColor: newStatus === 'approved' ? '#10b981' : '#ef4444',
    confirmButtonText: `Yes, ${actionText} it!`
  });

  if (result.isConfirmed) {
    if (window._9jaCash && window._9jaCash.db) {
      const db = window._9jaCash.db;
      try {
        await db.collection("withdrawals").doc(id).update({ status: newStatus });
        Swal.fire('Success!', `Withdrawal has been ${newStatus}.`, 'success');
        loadWithdrawals();
      } catch (err) {
        console.error("Error updating status:", err);
        Swal.fire('Error', 'Failed to update withdrawal status.', 'error');
      }
    }
  }
}

window.addEventListener("DOMContentLoaded", function() {
  initTheme();
  loadWithdrawals();
});
</script>

</body>
</html>
