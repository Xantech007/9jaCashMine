<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Manage Deposits - FlutterW Euro Earn</title>

<!-- Firebase SDKs (Compat) -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<!-- Make sure firebase.js is correctly linked relative to the admin folder (e.g., ../firebase.js) -->
<script src="../firebase.js"></script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f172a; color: #f8fafc; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 20px; }
  .table-row { border-bottom: 1px solid #334155; transition: background 0.2s; }
  .table-row:hover { background: rgba(51, 65, 85, 0.4); }
  .badge-pending { background: rgba(245, 158, 11, 0.1); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.2); }
  .badge-approved { background: rgba(16, 185, 129, 0.1); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.2); }
  .badge-rejected { background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); }
</style>
</head>
<body class="min-h-screen p-4 md:p-8">

<div class="max-w-7xl mx-auto">
  <!-- Top Bar -->
  <div class="flex items-center justify-between mb-8">
    <div>
      <h1 class="text-2xl font-extrabold text-white">Deposit Management</h1>
      <p class="text-sm text-slate-400 mt-1">Review user deposits, check uploaded server payment proofs, and update statuses.</p>
    </div>
    <a href="dashboard.html" class="px-4 py-2 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 hover:bg-slate-700 transition text-sm font-semibold">
      <i class="fa-solid fa-arrow-left mr-2"></i> Back to Dashboard
    </a>
  </div>

  <!-- Filters / Stats Summary -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
    <div class="card p-5">
      <div class="text-slate-400 text-xs font-bold uppercase tracking-wider">Total Deposits</div>
      <div id="statTotal" class="text-2xl font-extrabold text-white mt-1">0</div>
    </div>
    <div class="card p-5">
      <div class="text-slate-400 text-xs font-bold uppercase tracking-wider">Pending Deposits</div>
      <div id="statPending" class="text-2xl font-extrabold text-amber-400 mt-1">0</div>
    </div>
    <div class="card p-5">
      <div class="text-slate-400 text-xs font-bold uppercase tracking-wider">Approved Deposits</div>
      <div id="statApproved" class="text-2xl font-extrabold text-emerald-400 mt-1">0</div>
    </div>
  </div>

  <!-- Deposits Table Container -->
  <div class="card overflow-hidden">
    <div class="p-5 border-b border-slate-700 flex justify-between items-center">
      <h3 class="font-bold text-white text-lg"><i class="fa-solid fa-money-bill-transfer mr-2 text-indigo-500"></i> All Deposits</h3>
      <button onclick="loadDeposits()" class="text-xs px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-semibold transition">
        <i class="fa-solid fa-rotate mr-1"></i> Refresh
      </button>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-slate-900/50 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-700">
            <th class="p-4">User</th>
            <th class="p-4">Type / Plan</th>
            <th class="p-4">Amount</th>
            <th class="p-4">Method</th>
            <th class="p-4">Date</th>
            <th class="p-4">Status</th>
            <th class="p-4 text-center">Proof</th>
            <th class="p-4 text-right">Actions</th>
          </tr>
        </thead>
        <tbody id="depositsTableBody" class="text-sm">
          <tr>
            <td colspan="8" class="p-8 text-center text-slate-400">Loading deposits...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Receipt Modal Preview -->
<div id="receiptModal" class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4 hidden">
  <div class="card max-w-lg w-full p-6 relative bg-slate-900">
    <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <h3 class="text-lg font-bold text-white mb-4">Payment Proof Preview</h3>
    <div id="modalContent" class="flex flex-col items-center justify-center">
      <!-- Injected preview image or PDF link -->
    </div>
  </div>
</div>

<script>
let allDeposits = [];

// Load Deposits from Firestore
function loadDeposits() {
  const tbody = document.getElementById("depositsTableBody");
  tbody.innerHTML = `<tr><td colspan="8" class="p-8 text-center text-slate-400"><i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Loading deposits...</td></tr>`;

  if (!window._9jaCash || !window._9jaCash.db) {
    tbody.innerHTML = `<tr><td colspan="8" class="p-8 text-center text-red-400">Firebase database reference not found.</td></tr>`;
    return;
  }

  window._9jaCash.db.collection("deposits")
    .orderBy("createdAt", "desc")
    .get()
    .then((snapshot) => {
      allDeposits = [];
      let pendingCount = 0;
      let approvedCount = 0;

      snapshot.forEach((doc) => {
        const data = doc.data();
        allDeposits.push({ id: doc.id, ...data });

        if (data.status === "pending") pendingCount++;
        if (data.status === "approved") approvedCount++;
      });

      document.getElementById("statTotal").textContent = allDeposits.length;
      document.getElementById("statPending").textContent = pendingCount;
      document.getElementById("statApproved").textContent = approvedCount;

      renderTable(allDeposits);
    })
    .catch((error) => {
      console.error("Error fetching deposits:", error);
      tbody.innerHTML = `<tr><td colspan="8" class="p-8 text-center text-red-400">Error loading deposits: ${error.message}</td></tr>`;
    });
}

function renderTable(deposits) {
  const tbody = document.getElementById("depositsTableBody");
  if (deposits.length === 0) {
    tbody.innerHTML = `<tr><td colspan="8" class="p-8 text-center text-slate-400">No deposits found.</td></tr>`;
    return;
  }

  let html = "";
  deposits.forEach((item) => {
    const statusClass = item.status === "approved" ? "badge-approved" : item.status === "rejected" ? "badge-rejected" : "badge-pending";
    const amountStr = (item.currencySymbol || "€") + (parseFloat(item.amount || 0)).toLocaleString();
    const dateStr = item.date || "—";
    const userName = item.userName || "Unknown User";
    const userId = item.userId || item.userPhone || "—";
    const planOrType = item.plan || item.flowType || "Standard Deposit";
    const method = (item.paymentMethod || "bank").toUpperCase();

    html += `
      <tr class="table-row">
        <td class="p-4">
          <div class="font-bold text-white">${userName}</div>
          <div class="text-xs text-slate-400">${userId}</div>
        </td>
        <td class="p-4 font-semibold text-indigo-300">${planOrType}</td>
        <td class="p-4 font-bold text-white">${amountStr}</td>
        <td class="p-4"><span class="px-2.5 py-1 rounded-md text-xs font-semibold bg-slate-800 text-slate-300 border border-slate-700">${method}</span></td>
        <td class="p-4 text-xs text-slate-400">${dateStr}</td>
        <td class="p-4"><span class="px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider ${statusClass}">${item.status || "pending"}</span></td>
        <td class="p-4 text-center">
          ${item.receiptPath ? `<button onclick="viewReceipt('${item.receiptPath}')" class="px-3 py-1.5 rounded-lg bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 hover:bg-indigo-600/30 text-xs font-bold transition"><i class="fa-solid fa-eye mr-1"></i> View</button>` : '<span class="text-slate-500 text-xs">No Proof</span>'}
        </td>
        <td class="p-4 text-right">
          <select onchange="updateDepositStatus('${item.id}', this.value)" class="bg-slate-900 border border-slate-700 text-white text-xs rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 outline-none">
            <option value="" disabled selected>Change Status</option>
            <option value="pending" ${item.status === "pending" ? "selected" : ""}>Pending</option>
            <option value="approved" ${item.status === "approved" ? "selected" : ""}>Approve</option>
            <option value="rejected" ${item.status === "rejected" ? "selected" : ""}>Reject</option>
          </select>
        </td>
      </tr>
    `;
  });

  tbody.innerHTML = html;
}

// Preview Uploaded Proof
function viewReceipt(path) {
  const modal = document.getElementById("receiptModal");
  const content = document.getElementById("modalContent");
  
  // Construct full file URL (assuming receipts are stored relative to root server path)
  const fullUrl = path.startsWith("http") ? path : `../${path}`;

  if (path.endsWith(".pdf") || path.toLowerCase().includes("pdf")) {
    content.innerHTML = `
      <iframe src="${fullUrl}" class="w-full h-96 rounded-xl border border-slate-700 mb-4"></iframe>
      <a href="${fullUrl}" target="_blank" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold hover:bg-indigo-500">Open PDF in New Tab</a>
    `;
  } else {
    content.innerHTML = `
      <img src="${fullUrl}" alt="Payment Proof" class="max-h-[70vh] rounded-xl border border-slate-700 object-contain mb-4">
      <a href="${fullUrl}" target="_blank" class="px-4 py-2 bg-slate-800 text-slate-300 border border-slate-700 rounded-xl text-xs font-semibold hover:bg-slate-700">Open Image Full Size</a>
    `;
  }

  modal.classList.remove("hidden");
}

function closeModal() {
  document.getElementById("receiptModal").classList.add("hidden");
}

// Update Status Function
function updateDepositStatus(docId, newStatus) {
  if (!docId || !newStatus) return;

  Swal.fire({
    title: "Update Status?",
    text: `Are you sure you want to mark this deposit as ${newStatus}?`,
    icon: "warning",
    showCancelButton: true,
    confirmButtonColor: "#6366f1",
    cancelButtonColor: "#334155",
    confirmButtonText: "Yes, Update",
    background: "#1e293b",
    color: "#f8fafc"
  }).then((result) => {
    if (result.isConfirmed) {
      window._9jaCash.db.collection("deposits").doc(docId).update({
        status: newStatus,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      })
      .then(() => {
        Swal.fire({
          toast: true,
          position: "top",
          icon: "success",
          title: `Deposit status updated to ${newStatus}!`,
          showConfirmButton: false,
          timer: 1500,
          background: "#1e293b",
          color: "#f8fafc"
        });
        loadDeposits();
      })
      .catch((error) => {
        console.error("Error updating status:", error);
        Swal.fire({
          icon: "error",
          title: "Update Failed",
          text: error.message,
          background: "#1e293b",
          color: "#f8fafc"
        });
      });
    } else {
      loadDeposits(); // Reset dropdown view
    }
  });
}

window.addEventListener("DOMContentLoaded", () => {
  loadDeposits();
});
</script>

</body>
</html>
