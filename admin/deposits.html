<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Manage Deposits - Flutterwave MineApp Admin</title>

<!-- Firebase SDKs Compat -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="../firebase.js"></script>

<!-- SweetAlert2 & Tailwind -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#0f172a;color:#f8fafc;min-height:100vh;transition:all 0.3s ease;}

/* Light Mode Overrides & Variables */
body.light-mode{background:#f8fafc;color:#1e293b;}
body.light-mode .soft-bg{background:radial-gradient(ellipse at 0% 0%,rgba(99,102,241,0.08),transparent 50%),radial-gradient(ellipse at 100% 100%,rgba(236,72,153,0.06),transparent 50%),radial-gradient(ellipse at 50% 50%,rgba(16,185,129,0.04),transparent 50%),#f8fafc;}
body.light-mode .back-btn{background:#fff;border-color:#e2e8f0;color:#64748b;}
body.light-mode .back-btn:hover{background:#f1f5f9;color:#6366f1;}
body.light-mode .header-title{color:#1e293b;}
body.light-mode .theme-toggle{background:#fff;border-color:#e2e8f0;color:#64748b;}
body.light-mode .theme-toggle:hover{background:#f1f5f9;color:#6366f1;}
body.light-mode .deposit-card{background:#fff;border-color:#e2e8f0;box-shadow:0 4px 16px rgba(0,0,0,0.04);}
body.light-mode .deposit-header{border-bottom-color:#e2e8f0;}
body.light-mode .deposit-user{color:#1e293b;}
body.light-mode .deposit-sub{color:#64748b;}
body.light-mode .deposit-item{background:#f8fafc;border-color:#e2e8f0;}
body.light-mode .deposit-label{color:#64748b;}
body.light-mode .deposit-value{color:#1e293b;}
body.light-mode .proof-preview-box{background:#f8fafc;border-color:#e2e8f0;}
body.light-mode .reversal-box{background:#fff7ed;border-color:#ffedd5;}
body.light-mode .reversal-title{color:#c2410c;}
body.light-mode .footer-text{color:#64748b;}
body.light-mode .filter-btn{background:#fff;color:#64748b;border-color:#e2e8f0;}
body.light-mode .filter-btn.active{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border-color:#6366f1;}

.soft-bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 0% 0%,rgba(99,102,241,0.12),transparent 50%),radial-gradient(ellipse at 100% 100%,rgba(236,72,153,0.08),transparent 50%),radial-gradient(ellipse at 50% 50%,rgba(16,185,129,0.06),transparent 50%),#0f172a;transition:all 0.3s ease;}

.app{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:0 20px 40px;}

.topbar{padding:24px 0 16px;display:flex;align-items:center;justify-content:space-between;}
.back-btn{width:44px;height:44px;border-radius:14px;background:#1e293b;border:1px solid #334155;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:16px;cursor:pointer;transition:all 0.3s;}
.back-btn:hover{background:#334155;color:#818cf8;}
.header-title{font-size:18px;font-weight:800;color:#f8fafc;transition:color 0.3s;}
.theme-toggle{width:44px;height:44px;border-radius:14px;background:#1e293b;border:1px solid #334155;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:16px;cursor:pointer;transition:all 0.3s;}
.theme-toggle:hover{background:#334155;color:#818cf8;}

.filter-bar{display:flex;gap:8px;margin-bottom:20px;overflow-x:auto;padding-bottom:4px;}
.filter-btn{padding:10px 16px;border-radius:12px;background:#1e293b;border:1px solid #334155;color:#94a3b8;font-size:12px;font-weight:700;cursor:pointer;transition:all 0.3s;white-space:nowrap;font-family:'Plus Jakarta Sans',sans-serif;display:flex;align-items:center;gap:6px;}
.filter-btn:hover{border-color:#6366f1;color:#818cf8;}
.filter-btn.active{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border-color:#6366f1;box-shadow:0 4px 16px rgba(99,102,241,0.3);}
.filter-count{background:rgba(255,255,255,0.2);padding:1px 6px;border-radius:10px;font-size:10px;}

/* Tabulated / Structured Card Layout */
.deposit-card{background:#1e293b;border:1px solid #334155;border-radius:20px;padding:18px;margin-bottom:16px;transition:all 0.3s;}
.deposit-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #334155;}
.deposit-user{font-size:15px;font-weight:800;color:#f8fafc;}
.deposit-sub{font-size:12px;color:#64748b;margin-top:2px;}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;border:1px solid transparent;}
.badge.pending{background:rgba(245,158,11,0.1);color:#fbbf24;border-color:rgba(245,158,11,0.2);}
.badge.approved{background:rgba(16,185,129,0.1);color:#10b981;border-color:rgba(16,185,129,0.2);}
.badge.rejected{background:rgba(239,68,68,0.1);color:#f87171;border-color:rgba(239,68,68,0.2);}
.badge.reversed{background:rgba(168,85,247,0.1);color:#c084fc;border-color:rgba(168,85,247,0.2);}

/* Tabulated Grid Structure */
.deposit-table-grid{display:grid;grid-template-columns:repeat(2, 1fr);gap:8px;margin-bottom:12px;}
@media(min-width: 500px){
  .deposit-table-grid{grid-template-columns:repeat(4, 1fr);}
}
.deposit-item{background:#0f172a;border:1px solid #334155;border-radius:10px;padding:8px 10px;}
.deposit-label{font-size:9px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px;}
.deposit-value{font-size:12px;font-weight:700;color:#f8fafc;word-break:break-all;}

/* Reversal Request Box */
.reversal-box{background:rgba(245,158,11,0.06);border:1px solid rgba(245,158,11,0.3);border-radius:14px;padding:12px;margin-top:12px;}
.reversal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.reversal-title{font-size:12px;font-weight:800;color:#fbbf24;display:flex;align-items:center;gap:6px;}
.reversal-grid{display:grid;grid-template-columns:repeat(2, 1fr);gap:8px;font-size:12px;margin-top:6px;}

/* Smaller Compact Preview Box */
.proof-preview-container{display:flex;align-items:center;justify-content:space-between;background:rgba(15,23,42,0.4);border:1px solid #334155;border-radius:10px;padding:8px 12px;margin-top:10px;gap:10px;}
.proof-info{display:flex;align-items:center;gap:8px;font-size:12px;color:#818cf8;font-weight:600;}
.proof-preview-box{width:48px;height:48px;border-radius:8px;overflow:hidden;border:1px solid #334155;background:#0f172a;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.proof-preview-box img{width:100%;height:100%;object-fit:cover;}
.proof-preview-box i{font-size:18px;color:#818cf8;}

.action-row{display:flex;gap:8px;margin-top:14px;}
.action-btn{flex:1;padding:8px 12px;border-radius:10px;font-size:12px;font-weight:700;border:none;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;justify-content:center;gap:6px;font-family:'Plus Jakarta Sans',sans-serif;}
.action-btn.approve{background:rgba(16,185,129,0.15);color:#10b981;border:1px solid rgba(16,185,129,0.3);}
.action-btn.approve:hover{background:#10b981;color:#fff;}
.action-btn.reject{background:rgba(239,68,68,0.15);color:#f87171;border:1px solid rgba(239,68,68,0.3);}
.action-btn.reject:hover{background:#ef4444;color:#fff;}
.action-btn.reverse{background:rgba(168,85,247,0.15);color:#c084fc;border:1px solid rgba(168,85,247,0.3);}
.action-btn.reverse:hover{background:#a855f7;color:#fff;}

.empty-state{text-align:center;padding:48px 20px;color:#64748b;}
.empty-state i{font-size:48px;margin-bottom:12px;color:#334155;}

.footer{text-align:center;margin-top:32px;}
.footer-text{font-size:12px;color:#64748b;font-weight:500;}

@keyframes slideUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.anim{animation:slideUp 0.6s ease both;}
</style>
</head>
<body>

<div class="soft-bg"></div>

<div class="app">

  <div class="topbar anim">
    <button class="back-btn" onclick="window.location.href='dashboard.html'">
      <i class="fa-solid fa-arrow-left"></i>
    </button>
    <div class="header-title">Admin Deposits</div>
    <button class="theme-toggle" onclick="toggleTheme()">
      <i class="fa-solid fa-sun" id="themeIcon"></i>
    </button>
  </div>

  <div class="filter-bar anim">
    <button class="filter-btn active" onclick="filterDeposits('all', this)">All Deposits</button>
    <button class="filter-btn" onclick="filterDeposits('reversals', this)">
      Reversals <span class="filter-count" id="revCount">0</span>
    </button>
    <button class="filter-btn" onclick="filterDeposits('pending', this)">Pending</button>
    <button class="filter-btn" onclick="filterDeposits('approved', this)">Approved</button>
    <button class="filter-btn" onclick="filterDeposits('rejected', this)">Rejected</button>
    <button class="filter-btn" onclick="filterDeposits('reversed', this)">Reversed</button>
  </div>

  <div id="depositsContainer" class="anim">
    <div class="empty-state">
      <i class="fa-solid fa-spinner fa-spin"></i>
      <p>Loading deposits...</p>
    </div>
  </div>

  <div class="footer anim">
    <div class="footer-text">Flutterwave MineApp Admin • 2026</div>
  </div>

</div>

<script>
let currentFilter = 'all';
let allDeposits = [];

function initTheme() {
  const isLight = localStorage.getItem("9jaCashDark") !== "true";
  if (isLight) {
    document.body.classList.add("light-mode");
    document.getElementById("themeIcon").className = "fa-solid fa-moon";
  }
}

function toggleTheme() {
  const isLight = document.body.classList.toggle("light-mode");
  localStorage.setItem("9jaCashDark", !isLight);
  document.getElementById("themeIcon").className = isLight ? "fa-solid fa-moon" : "fa-solid fa-sun";
}

function filterDeposits(status, btn) {
  currentFilter = status;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderDeposits();
}

function fetchDeposits() {
  if (window._9jaCash && window._9jaCash.db) {
    window._9jaCash.db.collection("deposits")
      .orderBy("createdAt", "desc")
      .onSnapshot(snapshot => {
        allDeposits = [];
        snapshot.forEach(doc => {
          allDeposits.push({ id: doc.id, ...doc.data() });
        });
        updateCounts();
        renderDeposits();
      }, err => {
        console.error("Error fetching deposits:", err);
        document.getElementById("depositsContainer").innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <p>Failed to load deposits. Please check permissions.</p>
          </div>
        `;
      });
  } else {
    setTimeout(fetchDeposits, 500);
  }
}

function updateCounts() {
  const revs = allDeposits.filter(d => d.reversalRequest && (d.status || 'pending').toLowerCase() !== 'reversed');
  document.getElementById("revCount").textContent = revs.length;
}

function renderDeposits() {
  const container = document.getElementById("depositsContainer");
  const filtered = allDeposits.filter(d => {
    const status = (d.status || 'pending').toLowerCase();
    if (currentFilter === 'all') return true;
    if (currentFilter === 'reversals') return !!d.reversalRequest;
    return status === currentFilter;
  });

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <i class="fa-solid fa-folder-open"></i>
        <p>No ${currentFilter === 'all' ? '' : currentFilter} deposits found.</p>
      </div>
    `;
    return;
  }

  let html = '';
  filtered.forEach(d => {
    const status = (d.status || 'pending').toLowerCase();
    const badgeClass = status === 'approved' ? 'approved' : status === 'rejected' ? 'rejected' : status === 'reversed' ? 'reversed' : 'pending';
    const amountStr = (d.currencySymbol || '€') + (d.amount || 0).toLocaleString();
    const receiptUrl = d.receiptPath ? (d.receiptPath.startsWith('http') ? d.receiptPath : '../' + d.receiptPath) : '';
    
    // Deposit Receipt Proof HTML
    let proofHtml = '';
    if (receiptUrl) {
      const isPdf = receiptUrl.endsWith('.pdf');
      proofHtml = `
        <div class="proof-preview-container">
          <div class="proof-info"><i class="fa-solid ${isPdf ? 'fa-file-pdf' : 'fa-image'}"></i> Original Payment Proof</div>
          <div class="proof-preview-box" onclick="window.open('${receiptUrl}', '_blank')" title="View Proof">
            ${isPdf ? '<i class="fa-solid fa-file-lines"></i>' : `<img src="${receiptUrl}" alt="Proof">`}
          </div>
        </div>
      `;
    } else {
      proofHtml = `<div class="deposit-sub" style="margin-top:8px;">No original receipt uploaded</div>`;
    }

    // Reversal Request Info HTML
    let reversalBoxHtml = '';
    if (d.reversalRequest) {
      const rev = d.reversalRequest;
      const revProofUrl = rev.proofPath ? (rev.proofPath.startsWith('http') ? rev.proofPath : '../' + rev.proofPath) : '';
      const revIsPdf = revProofUrl.endsWith('.pdf');
      const walletName = rev.walletHolderName || rev.accountName || '—';
      const walletNum = rev.walletNumber || '—';

      reversalBoxHtml = `
        <div class="reversal-box">
          <div class="reversal-header">
            <div class="reversal-title"><i class="fa-solid fa-rotate-left"></i> Reversal Request Submitted</div>
            <span style="font-size:10px;color:#94a3b8;">${rev.date || 'Recent'}</span>
          </div>
          <div class="reversal-grid">
            <div><span style="color:#64748b;">Wallet Name:</span> <b>${walletName}</b></div>
            <div><span style="color:#64748b;">Wallet Number:</span> <b>${walletNum}</b></div>
            <div><span style="color:#64748b;">Sent Amount:</span> <b style="color:#10b981;">${d.currencySymbol || '€'}${rev.actualAmount || '0'}</b></div>
          </div>
          <div style="font-size:11px;margin-top:6px;color:#94a3b8;">
            <b>Reason:</b> ${rev.reason || 'None provided'}
          </div>
          ${revProofUrl ? `
            <div class="proof-preview-container" style="margin-top:8px;background:rgba(0,0,0,0.2);">
              <div class="proof-info" style="color:#fbbf24;"><i class="fa-solid ${revIsPdf ? 'fa-file-pdf' : 'fa-image'}"></i> Reversal Proof</div>
              <div class="proof-preview-box" onclick="window.open('${revProofUrl}', '_blank')" title="View Reversal Proof">
                ${revIsPdf ? '<i class="fa-solid fa-file-lines"></i>' : `<img src="${revProofUrl}" alt="Reversal Proof">`}
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    html += `
      <div class="deposit-card">
        <div class="deposit-header">
          <div>
            <div class="deposit-user">${d.userName || 'Unknown User'}</div>
            <div class="deposit-sub">${d.userId || '—'} • ${d.date || 'Recent'}</div>
          </div>
          <span class="badge ${badgeClass}">${status.toUpperCase()}</span>
        </div>
        <div class="deposit-table-grid">
          <div class="deposit-item">
            <div class="deposit-label">Amount</div>
            <div class="deposit-value" style="color:#10b981;">${amountStr}</div>
          </div>
          <div class="deposit-item">
            <div class="deposit-label">Flow / Plan</div>
            <div class="deposit-value">${d.plan || d.flowType || 'General'}</div>
          </div>
          <div class="deposit-item">
            <div class="deposit-label">Method</div>
            <div class="deposit-value" style="text-transform:uppercase;">${d.paymentMethod || 'Bank'}</div>
          </div>
          <div class="deposit-item">
            <div class="deposit-label">Country</div>
            <div class="deposit-value">${d.userCountry || '—'}</div>
          </div>
        </div>
        ${proofHtml}
        ${reversalBoxHtml}
        
        <div class="action-row">
          <button class="action-btn approve" onclick="updateDepositStatus('${d.id}', 'approved')">
            <i class="fa-solid fa-check"></i> Approve
          </button>
          ${d.reversalRequest ? `
            <button class="action-btn reverse" onclick="updateDepositStatus('${d.id}', 'reversed')">
              <i class="fa-solid fa-rotate-left"></i> Reverse
            </button>
          ` : ''}
          <button class="action-btn reject" onclick="updateDepositStatus('${d.id}', 'rejected')">
            <i class="fa-solid fa-xmark"></i> Reject
          </button>
        </div>
      </div>
    `;
  });

  container.innerHTML = html;
}

async function updateDepositStatus(docId, newStatus) {
  const result = await Swal.fire({
    title: `Mark as ${newStatus.toUpperCase()}?`,
    text: `Are you sure you want to change this deposit status to ${newStatus.toUpperCase()}?`,
    icon: newStatus === 'approved' ? 'question' : newStatus === 'reversed' ? 'warning' : 'error',
    showCancelButton: true,
    confirmButtonColor: newStatus === 'approved' ? '#10b981' : newStatus === 'reversed' ? '#a855f7' : '#ef4444',
    cancelButtonColor: '#334155',
    confirmButtonText: `Yes, ${newStatus}`,
    background: document.body.classList.contains("light-mode") ? "#fff" : "#1e293b",
    color: document.body.classList.contains("light-mode") ? "#1e293b" : "#f8fafc"
  });

  if (!result.isConfirmed) return;

  try {
    if (window._9jaCash && window._9jaCash.db) {
      await window._9jaCash.db.collection("deposits").doc(docId).update({
        status: newStatus,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      if (newStatus === 'approved') {
        const depositObj = allDeposits.find(d => d.id === docId);
        if (depositObj && depositObj.userId && depositObj.plan && depositObj.flowType === 'upgrade') {
          await window._9jaCash.db.collection("users").doc(depositObj.userId).set({
            plan: depositObj.plan
          }, { merge: true });
        }
      }

      Swal.fire({
        toast: true,
        position: 'top',
        icon: 'success',
        title: `Deposit marked as ${newStatus}!`,
        showConfirmButton: false,
        timer: 1500,
        background: document.body.classList.contains("light-mode") ? "#fff" : "#1e293b",
        color: document.body.classList.contains("light-mode") ? "#1e293b" : "#f8fafc"
      });
    }
  } catch (err) {
    console.error("Error updating status:", err);
    Swal.fire({
      icon: 'error',
      title: 'Update Failed',
      text: err.message || 'Could not update deposit status.',
      background: document.body.classList.contains("light-mode") ? "#fff" : "#1e293b",
      color: document.body.classList.contains("light-mode") ? "#1e293b" : "#f8fafc"
    });
  }
}

window.addEventListener("DOMContentLoaded", () => {
  initTheme();
  fetchDeposits();
});
</script>

</body>
</html>
