<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Admin Login - FlutterW Euro Earn</title>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="../firebase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#0f172a;color:#f8fafc;min-height:100vh;transition:all 0.3s ease;}

body.light-mode{background:#f8fafc;color:#1e293b;}
body.light-mode .soft-bg{background:radial-gradient(ellipse at 0% 0%,rgba(99,102,241,0.08),transparent 50%),radial-gradient(ellipse at 100% 100%,rgba(236,72,153,0.06),transparent 50%),radial-gradient(ellipse at 50% 50%,rgba(16,185,129,0.04),transparent 50%),#f8fafc;}
body.light-mode .card{background:#fff;border-color:#e2e8f0;box-shadow:0 4px 24px rgba(0,0,0,0.06);}
body.light-mode .back-btn{background:#fff;border-color:#e2e8f0;color:#64748b;}
body.light-mode .back-btn:hover{background:#f1f5f9;color:#6366f1;}
body.light-mode .header-title{color:#1e293b;}
body.light-mode .footer-text{color:#94a3b8;}
body.light-mode .theme-toggle{color:#64748b;}
body.light-mode .flow-badge{background:#f1f5f9;color:#64748b;border-color:#e2e8f0;}
body.light-mode .input-field{background:#f8fafc;border-color:#e2e8f0;color:#1e293b;}
body.light-mode .input-field:focus{border-color:#6366f1;background:#fff;}

.soft-bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 0% 0%,rgba(99,102,241,0.12),transparent 50%),radial-gradient(ellipse at 100% 100%,rgba(236,72,153,0.08),transparent 50%),radial-gradient(ellipse at 50% 50%,rgba(16,185,129,0.06),transparent 50%),#0f172a;transition:all 0.3s ease;}

.app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:0 20px 40px;}

.topbar{padding:24px 0 16px;display:flex;align-items:center;justify-content:space-between;}
.back-btn{width:44px;height:44px;border-radius:14px;background:#1e293b;border:1px solid #334155;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:16px;cursor:pointer;transition:all 0.3s;}
.back-btn:hover{background:#334155;color:#818cf8;}
.back-btn:active{transform:scale(0.92);}
.header-title{font-size:18px;font-weight:800;color:#f8fafc;transition:color 0.3s;}
.theme-toggle{width:44px;height:44px;border-radius:14px;background:#1e293b;border:1px solid #334155;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:16px;cursor:pointer;transition:all 0.3s;}
.theme-toggle:hover{background:#334155;color:#818cf8;}

.flow-badge{display:inline-flex;align-items:center;gap:6px;background:#1e293b;border:1px solid #334155;border-radius:50px;padding:6px 14px;font-size:11px;font-weight:700;color:#6366f1;margin-bottom:16px;}
.flow-badge i{font-size:12px;}

.logo-container{text-align:center;padding:10px 0 24px;}
.logo-icon{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:28px;box-shadow:0 8px 24px rgba(99,102,241,0.4);margin-bottom:12px;}
.logo-title{font-size:22px;font-weight:900;letter-spacing:-0.5px;}
.logo-subtitle{font-size:13px;color:#94a3b8;margin-top:4px;font-weight:500;}

.card{background:#1e293b;border-radius:24px;padding:24px;border:1px solid #334155;box-shadow:0 4px 24px rgba(0,0,0,0.2);margin-bottom:16px;transition:all 0.3s ease;}

.input-group{margin-bottom:16px;}
.input-label{display:block;font-size:12px;font-weight:700;color:#94a3b8;margin-bottom:6px;}
.input-field{width:100%;padding:14px 16px;border-radius:14px;background:#0f172a;border:1px solid #334155;color:#f8fafc;font-size:14px;font-weight:600;outline:none;transition:all 0.3s;}
.input-field:focus{border-color:#6366f1;}

.submit-btn{width:100%;padding:18px;border-radius:18px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-size:16px;font-weight:800;border:none;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 4px 20px rgba(99,102,241,0.3);margin-top:8px;}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(99,102,241,0.4);}
.submit-btn:active{transform:scale(0.97);}
.submit-btn:disabled{background:#1e293b;color:#64748b;box-shadow:none;cursor:not-allowed;border:1px solid #334155;}

.footer{text-align:center;margin-top:32px;}
.footer-text{font-size:12px;color:#64748b;font-weight:500;}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);background:#1e293b;color:#fff;padding:14px 24px;border-radius:16px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;z-index:200;transition:all 0.4s;box-shadow:0 10px 40px rgba(0,0,0,0.3);border:1px solid #334155;}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast i{color:#6366f1;}

@keyframes slideUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.anim{animation:slideUp 0.6s ease both;}
</style>
</head>
<body>

<div class="soft-bg"></div>

<div class="app">

<div class="topbar anim">
  <button class="back-btn" onclick="window.location.href='../start.html'">
    <i class="fa-solid fa-arrow-left"></i>
  </button>
  <div class="header-title">Admin Portal</div>
  <button class="theme-toggle" onclick="toggleTheme()">
    <i class="fa-solid fa-sun" id="themeIcon"></i>
  </button>
</div>

<div class="anim" style="text-align:center;">
  <div class="flow-badge">
    <i class="fa-solid fa-shield-halved"></i> <span>Secure Gateway</span>
  </div>
</div>

<div class="logo-container anim">
  <div class="logo-icon"><i class="fa-solid fa-user-lock"></i></div>
  <div class="logo-title">Administrator Login</div>
  <div class="logo-subtitle">Enter your secure credentials to manage dashboard</div>
</div>

<div class="card anim">
  <div class="input-group">
    <label class="input-label">Admin Username / Email</label>
    <input type="text" id="adminEmail" class="input-field" placeholder="Enter admin username or email">
  </div>

  <div class="input-group">
    <label class="input-label">Password</label>
    <input type="password" id="adminPassword" class="input-field" placeholder="Enter admin password">
  </div>
</div>

<button class="submit-btn anim" id="loginBtn" onclick="handleAdminLogin()">
  <i class="fa-solid fa-right-to-bracket"></i> Login to Dashboard
</button>

<div class="footer anim">
  <div class="footer-text">FlutterW Euro Earn 2026 • Management Panel</div>
</div>

</div>

<div class="toast" id="toast"><i class="fa-solid fa-circle-exclamation"></i><span id="toastMsg">Error</span></div>

<script>
function initTheme() {
  const isLight = localStorage.getItem("9jaCashDark") !== "true";
  if (isLight) {
    document.body.classList.add("light-mode");
    document.getElementById("themeIcon").className = "fa-solid fa-moon";
  }
}

function toggleTheme() {
  const isLight = document.body.classList.toggle("light-mode");
  localStorage.setItem("9jaCashDark", !isLight);
  document.getElementById("themeIcon").className = isLight ? "fa-solid fa-moon" : "fa-solid fa-sun";
}

async function handleAdminLogin() {
  const identifier = document.getElementById("adminEmail").value.trim();
  const password = document.getElementById("adminPassword").value.trim();

  if (!identifier || !password) {
    showToast("Please enter both username/email and password");
    return;
  }

  const btn = document.getElementById("loginBtn");
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Verifying...';

  try {
    if (window._9jaCash && window._9jaCash.db) {
      const db = window._9jaCash.db;
      
      // Query the Firestore admins collection
      const adminQuery = await db.collection("admins")
        .where("email", "==", identifier)
        .get();

      if (adminQuery.empty) {
        // Try searching by username field if email match fails
        const usernameQuery = await db.collection("admins")
          .where("username", "==", identifier)
          .get();
          
        if (usernameQuery.empty) {
          throw new Error("Invalid admin credentials");
        }
        
        const adminDoc = usernameQuery.docs[0];
        verifyAdminData(adminDoc.data(), password);
      } else {
        const adminDoc = adminQuery.docs[0];
        verifyAdminData(adminDoc.data(), password);
      }
    } else {
      throw new Error("Database connection not initialized");
    }
  } catch (err) {
    console.error("Login error:", err);
    showToast(err.message || "Authentication failed");
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Login to Dashboard';
  }
}

function verifyAdminData(adminData, inputPassword) {
  if (adminData.password !== inputPassword) {
    throw new Error("Invalid password");
  }

  // Save session state for admin
  localStorage.setItem("9jaCashAdmin", JSON.stringify({
    username: adminData.username || adminData.email,
    role: "admin",
    loggedInAt: new Date().toISOString()
  }));

  showToast("Login successful! Redirecting...");
  setTimeout(() => {
    window.location.href = "../dashboard.html";
  }, 1000);
}

function showToast(msg) {
  const t = document.getElementById("toast");
  document.getElementById("toastMsg").textContent = msg;
  t.classList.add("show");
  setTimeout(() => { t.classList.remove("show"); }, 2500);
}

window.addEventListener("DOMContentLoaded", () => {
  initTheme();
});
</script>

</body>
</html>
