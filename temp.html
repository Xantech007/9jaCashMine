<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>9jaCash — Promo Videos Admin</title>
  
  <!-- Firebase Compat SDKs (Matches firebase.js) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <script src="firebase.js"></script>
  <script src="tiktok-player.js"></script>

  <!-- Tailwind CSS & Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #f8fafc;
      color: #1e293b;
      min-height: 100vh;
      transition: all 0.3s ease;
    }

    /* Dark mode styling */
    body.dark-mode { background: #0f172a; color: #f8fafc; }
    body.dark-mode .card { background: #1e293b; border-color: #334155; }
    body.dark-mode .inp { background: #0f172a; border-color: #334155; color: #f8fafc; }
    body.dark-mode .inp:focus { border-color: #6366f1; }
    body.dark-mode .item-card { background: #0f172a; border-color: #334155; }

    /* Main Container */
    .app { max-width: 600px; margin: 0 auto; padding: 24px 16px 40px; }
    .card {
      background: #fff;
      border-radius: 24px;
      padding: 24px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, #6366f1, #8b5cf6, #ec4899);
    }

    /* Form Inputs */
    .lbl { display: block; font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    body.dark-mode .lbl { color: #94a3b8; }
    .inp {
      width: 100%; padding: 12px 16px; border-radius: 12px;
      background: #f8fafc; border: 2px solid #e2e8f0; color: #1e293b;
      font-size: 14px; font-weight: 600; outline: none; transition: all 0.3s;
    }
    .inp:focus { border-color: #6366f1; background: #fff; }

    /* Buttons */
    .btn-primary {
      width: 100%; padding: 14px; border-radius: 14px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff;
      font-size: 15px; font-weight: 800; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all 0.3s; box-shadow: 0 4px 16px rgba(99,102,241,0.3);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(99,102,241,0.4); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .theme-toggle {
      position: fixed; top: 16px; right: 16px; width: 40px; height: 40px;
      border-radius: 12px; background: #fff; border: 1px solid #e2e8f0;
      display: flex; align-items: center; justify-content: center; color: #64748b;
      cursor: pointer; z-index: 50; transition: all 0.3s;
    }
    body.dark-mode .theme-toggle { background: #1e293b; border-color: #334155; color: #94a3b8; }

    .toast {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-80px);
      background: #1e293b; color: #fff; padding: 12px 20px; border-radius: 14px;
      display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600;
      z-index: 200; transition: all 0.4s; border: 1px solid #334155;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    .item-card {
      background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 16px;
      padding: 16px; margin-bottom: 12px; display: flex; align-items: center;
      justify-content: space-between; gap: 12px; transition: all 0.3s;
    }
  </style>
</head>
<body>

  <button class="theme-toggle" onclick="toggleTheme()"><i class="fa-solid fa-moon" id="themeIcon"></i></button>

  <div class="toast" id="toast">
    <i class="fa-solid fa-circle-check text-emerald-400" id="toastIcon"></i>
    <span id="toastMsg">Done</span>
  </div>

  <div class="app">
    <!-- Header -->
    <div class="flex items-center gap-3 mb-6 pt-4">
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-[#6366f1] to-[#8b5cf6] flex items-center justify-center text-white shadow-lg shadow-indigo-200 dark:shadow-none">
        <i class="fa-solid fa-film text-xl"></i>
      </div>
      <div>
        <h1 class="text-xl font-extrabold">Promo Videos Admin</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">Manage videos for the login/signup player</p>
      </div>
    </div>

    <!-- Video Upload / Add Form -->
    <div class="card">
      <h2 class="text-base font-bold mb-4 flex items-center gap-2">
        <i class="fa-solid fa-plus-circle text-indigo-500"></i> Add Promo Video
      </h2>
      <form id="videoForm" class="space-y-4">
        <div>
          <label class="lbl">Video Title / Caption</label>
          <input type="text" id="videoTitle" placeholder="e.g. How 9jaCash Works" class="inp" required />
        </div>

        <div>
          <label class="lbl">Video URL (MP4 Direct Link or YouTube URL)</label>
          <input type="url" id="videoUrl" placeholder="https://...mp4 or https://youtube.com/shorts/..." class="inp" required />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="lbl">Display Order</label>
            <input type="number" id="videoOrder" value="1" min="1" class="inp" required />
          </div>
          <div>
            <label class="lbl">Status</label>
            <select id="videoStatus" class="inp">
              <option value="true">Active</option>
              <option value="false">Disabled</option>
            </select>
          </div>
        </div>

        <button type="submit" id="saveBtn" class="btn-primary mt-2">
          <i class="fa-solid fa-cloud-arrow-up"></i>
          <span>Save Video</span>
        </button>
      </form>
    </div>

    <!-- Active Videos List -->
    <div class="card">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-base font-bold flex items-center gap-2">
          <i class="fa-solid fa-list-ul text-indigo-500"></i> Uploaded Videos
        </h2>
        <button onclick="previewAllVideos()" class="text-xs font-bold text-indigo-600 hover:text-indigo-500 dark:text-indigo-400 flex items-center gap-1">
          <i class="fa-solid fa-play text-[10px]"></i> Preview Player
        </button>
      </div>

      <div id="videoList" class="space-y-3">
        <div class="text-center py-6 text-slate-400 text-sm">
          <i class="fa-solid fa-spinner fa-spin text-lg mb-2 block"></i> Loading videos...
        </div>
      </div>
    </div>
  </div>

  <script>
    let localVideosCache = [];

    // Helper Toast
    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      const icon = document.getElementById('toastIcon');
      document.getElementById('toastMsg').textContent = msg;
      
      icon.className = isError ? 'fa-solid fa-circle-xmark text-red-500' : 'fa-solid fa-circle-check text-emerald-400';
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // Initialize Theme
    function initTheme() {
      const isDark = localStorage.getItem('9jaCashDark') === 'true';
      if (isDark) {
        document.body.classList.add('dark-mode');
        document.getElementById('themeIcon').className = 'fa-solid fa-sun';
      }
    }

    function toggleTheme() {
      const isDark = document.body.classList.toggle('dark-mode');
      localStorage.setItem('9jaCashDark', isDark);
      document.getElementById('themeIcon').className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
    }

    // Load Videos from Firestore `loginVideos`
    async function loadVideos() {
      const container = document.getElementById('videoList');
      try {
        const db = (window._9jaCash && window._9jaCash.db) || (typeof firebase !== 'undefined' ? firebase.firestore() : null);
        if (!db) throw new Error("Firestore SDK not initialized");

        const snap = await db.collection('loginVideos').get();
        localVideosCache = snap.docs
          .map(doc => ({ id: doc.id, ...doc.data() }))
          .sort((a, b) => (a.order || 0) - (b.order || 0));

        if (localVideosCache.length === 0) {
          container.innerHTML = `
            <div class="text-center py-6 text-slate-400 text-xs">
              No promo videos uploaded yet. Use the form above to add one.
            </div>`;
          return;
        }

        container.innerHTML = localVideosCache.map((item, index) => `
          <div class="item-card">
            <div class="flex-1 min-w-0 pr-2">
              <div class="flex items-center gap-2">
                <span class="text-[10px] font-extrabold px-2 py-0.5 rounded bg-indigo-100 text-indigo-700 dark:bg-indigo-900/50 dark:text-indigo-300">
                  #${item.order || index + 1}
                </span>
                <span class="text-xs font-bold truncate">${item.title || 'Untitled Video'}</span>
                ${item.active === false ? '<span class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-red-100 text-red-600 dark:bg-red-900/50 dark:text-red-400">Disabled</span>' : ''}
              </div>
              <p class="text-[11px] text-slate-400 truncate mt-1">${item.video_url || item.url || ''}</p>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="previewSingleVideo(${index})" class="p-2 text-slate-500 hover:text-indigo-600 dark:hover:text-indigo-400 text-sm" title="Preview">
                <i class="fa-solid fa-circle-play"></i>
              </button>
              <button onclick="deleteVideo('${item.id}')" class="p-2 text-slate-500 hover:text-red-500 text-sm" title="Delete">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>
          </div>
        `).join('');

      } catch (err) {
        console.error('Error loading promo videos:', err);
        container.innerHTML = `<div class="text-center py-4 text-red-500 text-xs font-semibold">Failed to load videos from Firestore.</div>`;
      }
    }

    // Save Video to Firestore
    document.getElementById('videoForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const saveBtn = document.getElementById('saveBtn');
      const originalText = saveBtn.innerHTML;

      const title = document.getElementById('videoTitle').value.trim();
      const video_url = document.getElementById('videoUrl').value.trim();
      const order = parseInt(document.getElementById('videoOrder').value, 10) || 1;
      const active = document.getElementById('videoStatus').value === 'true';

      if (!title || !video_url) {
        showToast('Please fill in all fields', true);
        return;
      }

      try {
        saveBtn.disabled = true;
        saveBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>Saving...</span>';

        const db = (window._9jaCash && window._9jaCash.db) || firebase.firestore();
        
        await db.collection('loginVideos').add({
          title: title,
          video_url: video_url,
          order: order,
          active: active,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        showToast('Promo video added successfully!');
        document.getElementById('videoForm').reset();
        document.getElementById('videoOrder').value = localVideosCache.length + 2;
        loadVideos();
      } catch (err) {
        console.error("Error saving promo video:", err);
        showToast('Failed to save promo video', true);
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerHTML = originalText;
      }
    });

    // Delete Video Document from Firestore
    async function deleteVideo(id) {
      if (!confirm('Are you sure you want to delete this promo video?')) return;
      try {
        const db = (window._9jaCash && window._9jaCash.db) || firebase.firestore();
        await db.collection('loginVideos').doc(id).delete();
        showToast('Video deleted');
        loadVideos();
      } catch (err) {
        console.error('Delete error:', err);
        showToast('Could not delete video', true);
      }
    }

    // Modal Preview Helpers
    function previewAllVideos() {
      const activeVideos = localVideosCache.filter(v => v.active !== false);
      if (!activeVideos.length) {
        showToast('No active videos available for preview', true);
        return;
      }
      showTikTokModal(activeVideos, 0);
    }

    function previewSingleVideo(index) {
      if (localVideosCache[index]) {
        showTikTokModal([localVideosCache[index]], 0);
      }
    }

    // Init Page
    window.addEventListener('DOMContentLoaded', () => {
      initTheme();
      loadVideos();
    });
  </script>
</body>
</html>
