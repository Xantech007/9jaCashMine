<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FlutterW Euro Earn — Login</title>

<!-- PWA / Add to Home Screen -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FlutterW Euro Earn">
<link rel="apple-touch-icon" href="FlutterWEuroEarn.png">
<meta name="theme-color" content="#6366f1">
<meta name="mobile-web-app-capable" content="yes">

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#f8fafc;color:#1e293b;min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;}

.soft-bg{position:fixed;inset:0;z-index:0;background:
  radial-gradient(ellipse at 0% 0%,rgba(99,102,241,0.10),transparent 50%),
  radial-gradient(ellipse at 100% 100%,rgba(236,72,153,0.07),transparent 50%),
  radial-gradient(ellipse at 50% 50%,rgba(16,185,129,0.04),transparent 50%),
  #f8fafc;}

.shape{position:absolute;border-radius:50%;filter:blur(60px);pointer-events:none;animation:shapeFloat 15s ease-in-out infinite;}
.shape-1{width:200px;height:200px;background:rgba(99,102,241,0.12);top:5%;right:10%;animation-delay:0s;}
.shape-2{width:160px;height:160px;background:rgba(16,185,129,0.10);bottom:20%;left:5%;animation-delay:5s;}
.shape-3{width:120px;height:120px;background:rgba(236,72,153,0.08);top:40%;left:30%;animation-delay:10s;}
@keyframes shapeFloat{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(20px,-20px) scale(1.1);}}

.card{background:#fff;border-radius:24px;padding:28px;border:1px solid #f1f5f9;box-shadow:0 4px 24px rgba(0,0,0,0.06),0 1px 3px rgba(0,0,0,0.04);transition:all 0.3s ease;}

.btn-primary{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;box-shadow:0 4px 20px rgba(99,102,241,0.3);transition:all 0.3s;}
.btn-primary:hover{box-shadow:0 6px 24px rgba(99,102,241,0.4);transform:translateY(-2px);}
.btn-primary:active{transform:scale(0.97);}

.input-group{position:relative;}
.input-field{width:100%;padding:14px 16px 14px 48px;border-radius:16px;border:1.5px solid #e2e8f0;background:#fff;font-size:14px;font-weight:600;color:#1e293b;transition:all 0.3s;outline:none;}
.input-field:focus{border-color:#6366f1;box-shadow:0 0 0 4px rgba(99,102,241,0.1);}
.input-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:16px;transition:all 0.3s;}
.input-field:focus ~ .input-icon{color:#6366f1;}

.s1{animation:slideUp 0.7s cubic-bezier(0.34,1.56,0.64,1) 0.1s both;}
.s2{animation:slideUp 0.7s cubic-bezier(0.34,1.56,0.64,1) 0.2s both;}

@keyframes slideUp{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);background:#1e293b;color:#fff;padding:14px 24px;border-radius:16px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;z-index:200;transition:all 0.4s;box-shadow:0 10px 40px rgba(0,0,0,0.3);border:1px solid #334155;}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast i{color:#10b981;}
.toast.error i{color:#ef4444;}

.app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:0 20px 80px;}
</style>
</head>
<body>

<div class="soft-bg">
  <div class="shape shape-1"></div>
  <div class="shape shape-2"></div>
  <div class="shape shape-3"></div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"><i class="fa-solid fa-circle-check" id="toastIcon"></i><span id="toastMsg">Done</span></div>

<div class="app">

  <!-- Header -->
  <div class="s1 pt-8 pb-6 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-3 text-decoration-none">
      <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-[#6366f1] to-[#8b5cf6] flex items-center justify-center shadow-lg shadow-indigo-200">
        <i class="fa-solid fa-bolt text-white text-lg"></i>
      </div>
      <div>
        <h1 class="font-extrabold text-lg tracking-tight">FlutterW Euro Earn</h1>
        <p class="text-[11px] font-semibold text-[#64748b]">Account Login</p>
      </div>
    </a>
    <a href="start.html" class="px-3 py-1.5 rounded-xl border border-indigo-200 bg-indigo-50/50 text-indigo-600 font-bold text-xs hover:bg-indigo-100 transition flex items-center gap-1.5">
      Register
    </a>
  </div>

  <!-- Login Card -->
  <div class="s2 card mb-5">
    <div class="text-center mb-6">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-[#6366f1] to-[#8b5cf6] flex items-center justify-center mx-auto mb-4 shadow-xl shadow-indigo-200">
        <i class="fa-solid fa-right-to-bracket text-white text-2xl"></i>
      </div>
      <h2 class="text-2xl font-black mb-1">Welcome Back</h2>
      <p class="text-[13px] text-[#64748b]">Sign in with your phone number and password</p>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <!-- Phone Number -->
      <div class="mb-4">
        <label class="block text-xs font-bold text-[#64748b] uppercase tracking-wider mb-2">Phone Number</label>
        <div class="input-group">
          <input type="tel" id="loginPhone" class="input-field" placeholder="Enter registered phone number" required>
          <i class="fa-solid fa-phone input-icon"></i>
        </div>
        <p class="text-[11px] text-[#94a3b8] mt-1.5 font-medium">Enter the phone number used during registration.</p>
      </div>

      <!-- Password -->
      <div class="mb-6">
        <label class="block text-xs font-bold text-[#64748b] uppercase tracking-wider mb-2">Password</label>
        <div class="input-group">
          <input type="password" id="loginPassword" class="input-field" placeholder="Enter your password" required>
          <i class="fa-solid fa-lock input-icon"></i>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="loginBtn" class="btn-primary w-full py-4 rounded-2xl font-bold text-[15px] flex items-center justify-center gap-2">
        <span id="loginBtnText">Sign In</span>
        <i class="fa-solid fa-arrow-right text-sm" id="loginBtnIcon"></i>
      </button>
    </form>

    <div class="text-center mt-6">
      <p class="text-[13px] text-[#64748b]">
        Don't have an account? <a href="start.html" class="text-[#6366f1] font-bold hover:underline">Register here</a>
      </p>
    </div>
  </div>

  <!-- Footer Info -->
  <div class="text-center pb-4">
    <p class="text-[11px] text-[#94a3b8] font-medium"><i class="fa-solid fa-shield-halved text-[#10b981] mr-1"></i> Secure Database Authentication</p>
  </div>

</div>

<script>
// ========== TOAST ==========
function showToast(msg, isError = false) {
  const t = document.getElementById("toast");
  const icon = document.getElementById("toastIcon");
  document.getElementById("toastMsg").textContent = msg;
  
  if (isError) {
    t.classList.add("error");
    icon.className = "fa-solid fa-circle-exclamation";
  } else {
    t.classList.remove("error");
    icon.className = "fa-solid fa-circle-check";
  }
  
  t.classList.add("show");
  setTimeout(function() { t.classList.remove("show"); }, 3000);
}

// ========== LOGIN HANDLER ==========
async function handleLogin(e) {
  e.preventDefault();
  
  const phoneInput = document.getElementById("loginPhone").value.trim();
  const passwordInput = document.getElementById("loginPassword").value;
  
  if (!phoneInput || !passwordInput) {
    showToast("Please fill in all fields", true);
    return;
  }

  const btn = document.getElementById("loginBtn");
  const btnText = document.getElementById("loginBtnText");
  const btnIcon = document.getElementById("loginBtnIcon");

  // Loading state
  btn.disabled = true;
  btnText.textContent = "Signing in...";
  btnIcon.className = "fa-solid fa-spinner fa-spin text-sm";

  try {
    // Check if firebase is initialized
    if (typeof db === 'undefined') {
      throw new Error("Database connection not initialized. Please check firebase.js");
    }

    // Clean phone number format if needed (or query directly as document ID)
    // Firestore document IDs under 'users' collection corresponding to user's phone
    const userDocRef = db.collection("users").doc(phoneInput);
    const userDoc = await userDocRef.get();

    if (!userDoc.exists) {
      throw new Error("No account found with this phone number.");
    }

    const userData = userDoc.data();

    // Verify password match with the document field
    if (userData.password !== passwordInput) {
      throw new Error("Incorrect password. Please try again.");
    }

    // Store session in localStorage (consistent with dashboard/start implementation)
    localStorage.setItem("9jaCashUser", JSON.stringify({
      phone: userDoc.id,
      fullName: userData.fullName || userData.name || "User",
      balance: userData.balance || 0,
      currency: userData.currency || "€"
    }));

    showToast("Login successful! Redirecting...");
    
    setTimeout(function() {
      window.location.href = "dashboard.html";
    }, 1200);

  } catch (error) {
    console.error("Login error:", error);
    showToast(error.message || "Login failed. Please check your details.", true);
    
    // Reset button
    btn.disabled = false;
    btnText.textContent = "Sign In";
    btnIcon.className = "fa-solid fa-arrow-right text-sm";
  }
}
</script>

</body>
</html>
