<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Transaction History - FlutterW Euro Earn</title>

<!-- Firebase Compat SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#0f172a;color:#f8fafc;min-height:100vh;transition:all 0.3s ease;}

/* Light Mode Overrides */
body.light-mode{background:#f8fafc;color:#1e293b;}
body.light-mode .soft-bg{background:radial-gradient(ellipse at 0% 0%,rgba(99,102,241,0.08),transparent 50%),radial-gradient(ellipse at 100% 100%,rgba(236,72,153,0.06),transparent 50%),radial-gradient(ellipse at 50% 50%,rgba(16,185,129,0.04),transparent 50%),#f8fafc;}
body.light-mode .card{background:#fff;border-color:#e2e8f0;box-shadow:0 4px 24px rgba(0,0,0,0.06);}
body.light-mode .back-btn, body.light-mode .theme-toggle{background:#fff;border-color:#e2e8f0;color:#64748b;}
body.light-mode .back-btn:hover, body.light-mode .theme-toggle:hover{background:#f1f5f9;color:#6366f1;}
body.light-mode .header-title{color:#1e293b;}
body.light-mode .tx-card{background:#f8fafc;border-color:#e2e8f0;}
body.light-mode .tx-card:hover{border-color:#cbd5e1;}
body.light-mode .tx-sub{color:#64748b;}
body.light-mode .tx-date{color:#94a3b8;}
body.light-mode .tx-title{color:#1e293b;}
body.light-mode .stat-card{background:#fff;border-color:#e2e8f0;}
body.light-mode .stat-label{color:#94a3b8;}
body.light-mode .stat-value{color:#1e293b;}
body.light-mode .swal2-popup{background:#fff !important;color:#1e293b !important;}

.soft-bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 0% 0%,rgba(99,102,241,0.12),transparent 50%),radial-gradient(ellipse at 100% 100%,rgba(236,72,153,0.08),transparent 50%),radial-gradient(ellipse at 50% 50%,rgba(16,185,129,0.06),transparent 50%),#0f172a;transition:all 0.3s ease;}

.app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:0 20px 40px;}

/* Top Navigation Bar */
.topbar{padding:24px 0 16px;display:flex;align-items:center;justify-content:space-between;}
.back-btn{width:44px;height:44px;border-radius:14px;background:#1e293b;border:1px solid #334155;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:16px;cursor:pointer;transition:all 0.3s;}
.back-btn:hover{background:#334155;color:#818cf8;}
.back-btn:active{transform:scale(0.92);}
.header-title{font-size:18px;font-weight:800;color:#f8fafc;transition:color 0.3s;}
.theme-toggle{width:44px;height:44px;border-radius:14px;background:#1e293b;border:1px solid #334155;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:16px;cursor:pointer;transition:all 0.3s;}
.theme-toggle:hover{background:#334155;color:#818cf8;}

/* Stats Container */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
.stat-card{background:#1e293b;border:1px solid #334155;border-radius:20px;padding:16px;transition:all 0.3s;}
.stat-label{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;}
.stat-value{font-size:20px;font-weight:900;color:#f8fafc;}

/* Filter & List Header */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.section-title{font-size:14px;font-weight:800;color:#94a3b8;text-transform:uppercase;letter-spacing:1px;}

/* Transaction Items */
.tx-list{display:flex;flex-direction:column;gap:12px;}
.tx-card{background:#1e293b;border:1px solid #334155;border-radius:20px;padding:16px;transition:all 0.3s;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.tx-card:hover{border-color:#6366f1;}

.tx-left{display:flex;align-items:center;gap:12px;overflow:hidden;}
.tx-icon{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.tx-icon.completed{background:rgba(16,185,129,0.12);color:#10b981;border:1px solid rgba(16,185,129,0.2);}
.tx-icon.pending{background:rgba(245,158,11,0.12);color:#fbbf24;border:1px solid rgba(245,158,11,0.2);}
.tx-icon.failed{background:rgba(239,68,68,0.12);color:#f87171;border:1px solid rgba(239,68,68,0.2);}

.tx-details{display:flex;flex-direction:column;gap:2px;overflow:hidden;}
.tx-title{font-size:14px;font-weight:800;color:#f8fafc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tx-sub{font-size:12px;color:#64748b;font-weight:600;}
.tx-date{font-size:11px;color:#475569;font-weight:500;}

.tx-right{text-align:right;flex-shrink:0;}
.tx-amount{font-size:15px;font-weight:800;color:#10b981;}
.tx-status{display:inline-block;font-size:10px;font-weight:800;padding:3px 8px;border-radius:20px;text-transform:uppercase;margin-top:4px;}
.tx-status.completed{background:rgba(16,185,129,0.15);color:#10b981;}
.tx-status.pending{background:rgba(245,158,11,0.15);color:#fbbf24;}
.tx-status.failed{background:rgba(239,68,68,0.15);color:#f87171;}

/* Empty / Loading State */
.state-box{background:#1e293b;border:1px dashed #334155;border-radius:20px;padding:40px 20px;text-align:center;color:#64748b;}
.state-box i{font-size:36px;margin-bottom:12px;color:#334155;}
.state-box p{font-size:14px;font-weight:600;}

/* Animations */
@keyframes slideUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.anim{animation:slideUp 0.5s ease both;}
.d1{animation-delay:0.1s;}
.d2{animation-delay:0.2s;}
.d3{animation-delay:0.3s;}
</style>
</head>
<body>

<div class="soft-bg"></div>

<div class="app">

  <!-- Topbar -->
  <div class="topbar anim d1">
    <button class="back-btn" onclick="goBack()">
      <i class="fa-solid fa-arrow-left"></i>
    </button>
    <div class="header-title">Deposit History</div>
    <button class="theme-toggle" onclick="toggleTheme()">
      <i class="fa-solid fa-sun" id="themeIcon"></i>
    </button>
  </div>

  <!-- Summary Stats -->
  <div class="stats-grid anim d2">
    <div class="stat-card">
      <div class="stat-label">Total Deposited</div>
      <div class="stat-value" id="statTotalAmount">€0.00</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Transactions</div>
      <div class="stat-value" id="statTotalCount">0</div>
    </div>
  </div>

  <!-- Section Header -->
  <div class="section-header anim d2">
    <div class="section-title">Recent Deposits</div>
    <button onclick="fetchDepositsHistory()" style="color:#6366f1;font-size:12px;font-weight:700;background:none;border:none;cursor:pointer;">
      <i class="fa-solid fa-rotate-right"></i> Refresh
    </button>
  </div>

  <!-- Transactions List -->
  <div class="tx-list anim d3" id="txContainer">
    <div class="state-box">
      <i class="fa-solid fa-circle-notch fa-spin"></i>
      <p>Loading deposit history...</p>
    </div>
  </div>

</div>

<script>
// ========== AUTH & GLOBALS ==========
let userData = null;
try {
  userData = JSON.parse(localStorage.getItem("9jaCashUser"));
} catch(e) { userData = null; }

if (!userData) {
  window.location.href = "start.html";
}

// ========== THEME MANAGEMENT ==========
function initTheme() {
  const isLight = localStorage.getItem("9jaCashDark") !== "true";
  if (isLight) {
    document.body.classList.add("light-mode");
    document.getElementById("themeIcon").className = "fa-solid fa-moon";
  }
}

function toggleTheme() {
  const isLight = document.body.classList.toggle("light-mode");
  localStorage.setItem("9jaCashDark", !isLight);
  document.getElementById("themeIcon").className = isLight ? "fa-solid fa-moon" : "fa-solid fa-sun";
}

function goBack() {
  window.location.href = "dashboard.html";
}

// ========== FORMAT MONEY HELPER ==========
function formatMoney(num, symbol = "€") {
  let n = parseFloat(num);
  if (isNaN(n)) return symbol + "0.00";
  return symbol + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// ========== FETCH DEPOSITS FROM FIRESTORE ==========
async function fetchDepositsHistory() {
  const container = document.getElementById("txContainer");
  const userId = userData.phone || userData.uid;

  if (!userId) {
    container.innerHTML = `
      <div class="state-box">
        <i class="fa-solid fa-triangle-exclamation" style="color:#ef4444;"></i>
        <p>User session invalid. Please log in again.</p>
      </div>`;
    return;
  }

  container.innerHTML = `
    <div class="state-box">
      <i class="fa-solid fa-circle-notch fa-spin"></i>
      <p>Loading deposit history...</p>
    </div>`;

  try {
    if (!window._9jaCash || !window._9jaCash.db) {
      throw new Error("Firestore instance not initialized.");
    }

    // Query deposits where userId matches the active logged-in user
    const snapshot = await window._9jaCash.db
      .collection("deposits")
      .where("userId", "==", userId)
      .get();

    if (snapshot.empty) {
      container.innerHTML = `
        <div class="state-box">
          <i class="fa-solid fa-receipt"></i>
          <p>No deposit transactions found.</p>
        </div>`;
      document.getElementById("statTotalAmount").textContent = "€0.00";
      document.getElementById("statTotalCount").textContent = "0";
      return;
    }

    let deposits = [];
    let totalDeposited = 0;

    snapshot.forEach(doc => {
      const data = doc.data();
      deposits.push({ id: doc.id, ...data });

      // Calculate total for allow/completed deposits
      if (data.status === "completed" || data.status === "allow" || data.gateStatus === "allow") {
        totalDeposited += parseFloat(data.amount || 0);
      }
    });

    // Sort local array descending by creation date
    deposits.sort((a, b) => {
      const timeA = a.createdAt?.toDate ? a.createdAt.toDate().getTime() : new Date(a.date || 0).getTime();
      const timeB = b.createdAt?.toDate ? b.createdAt.toDate().getTime() : new Date(b.date || 0).getTime();
      return timeB - timeA;
    });

    // Update summary metrics
    document.getElementById("statTotalAmount").textContent = formatMoney(totalDeposited);
    document.getElementById("statTotalCount").textContent = deposits.length;

    // Render Deposit Cards
    container.innerHTML = "";
    deposits.forEach(item => {
      container.appendChild(createDepositCard(item));
    });

  } catch (err) {
    console.error("Error fetching deposits:", err);
    container.innerHTML = `
      <div class="state-box">
        <i class="fa-solid fa-circle-xmark" style="color:#ef4444;"></i>
        <p>Failed to load deposits. Please try again later.</p>
      </div>`;
  }
}

// ========== CREATE DEPOSIT CARD COMPONENT ==========
function createDepositCard(data) {
  const card = document.createElement("div");
  card.className = "tx-card";

  // Normalize status logic based on deposit document properties
  let status = (data.status || "pending").toLowerCase();
  if (data.gateStatus === "block" && status === "pending") {
    status = "pending";
  }

  let statusClass = "pending";
  let statusIcon = "fa-hourglass-half";

  if (status === "completed" || status === "allow" || status === "approved") {
    statusClass = "completed";
    statusIcon = "fa-circle-check";
  } else if (status === "failed" || status === "rejected" || status === "declined") {
    statusClass = "failed";
    statusIcon = "fa-circle-xmark";
  }

  // Display details
  const planTitle = data.plan || data.flowType?.toUpperCase() || "Deposit";
  const symbol = data.currencySymbol || "€";
  const formattedAmount = formatMoney(data.amount || 0, symbol);
  const payMethod = data.paymentMethod ? (data.paymentMethod.toUpperCase()) : "TRANSFER";
  const formattedDate = data.date || (data.createdAt?.toDate ? data.createdAt.toDate().toLocaleString() : "Recent");

  card.innerHTML = `
    <div class="tx-left">
      <div class="tx-icon ${statusClass}">
        <i class="fa-solid ${statusIcon}"></i>
      </div>
      <div class="tx-details">
        <div class="tx-title">${planTitle}</div>
        <div class="tx-sub"><i class="fa-solid fa-wallet" style="font-size:10px;"></i> ${payMethod}</div>
        <div class="tx-date">${formattedDate}</div>
      </div>
    </div>
    <div class="tx-right">
      <div class="tx-amount">+${formattedAmount}</div>
      <div class="tx-status ${statusClass}">${status}</div>
    </div>
  `;

  // Click card to inspect receipt/details via SweetAlert modal
  card.onclick = () => {
    let receiptHtml = "";
    if (data.receiptPath && data.receiptPath !== "external_gateway") {
      receiptHtml = `<div style="margin-top:12px;text-align:center;"><a href="${data.receiptPath}" target="_blank" style="color:#6366f1;font-weight:700;font-size:13px;text-decoration:underline;">View Uploaded Receipt</a></div>`;
    }

    Swal.fire({
      title: "Deposit Details",
      html: `
        <div style="text-align:left;font-size:13px;line-height:1.8;">
          <p><b>Plan:</b> ${planTitle}</p>
          <p><b>Amount:</b> ${formattedAmount}</p>
          <p><b>Method:</b> ${payMethod}</p>
          <p><b>Status:</b> <span style="text-transform:capitalize;">${status}</span></p>
          <p><b>Date:</b> ${formattedDate}</p>
          <p><b>Transaction ID:</b> <code style="font-size:11px;">${data.id}</code></p>
          ${receiptHtml}
        </div>
      `,
      confirmButtonText: "Close",
      confirmButtonColor: "#6366f1",
      background: document.body.classList.contains("light-mode") ? "#fff" : "#1e293b",
      color: document.body.classList.contains("light-mode") ? "#1e293b" : "#f8fafc"
    });
  };

  return card;
}

// ========== INITIALIZATION ==========
window.addEventListener("DOMContentLoaded", function() {
  initTheme();
  fetchDepositsHistory();
});
</script>

</body>
</html>
